<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="920" viewBox="0 0 1160 920" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="920" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="580" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">查閱與回填迴圈，鑲嵌在同一條逐段展開時間軸上</text>
  <text x="580" y="64" text-anchor="middle" font-size="13" fill="#6b7280">涉及具體案例或程式碼版本時，順勢查閱、順勢回填，不是另外一條獨立軌道</text>

  <!-- 外層：逐段展開節奏容器，y: 90 ~ 250 -->
  <rect x="40" y="90" width="1080" height="160" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="116" font-size="13.5" font-weight="700" fill="#374151">同一條時間軸：Day 14 定案的逐段展開節奏</text>

  <!-- 段落節點一：已完成，虛化 -->
  <rect x="64" y="136" width="176" height="86" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="152" y="164" text-anchor="middle" font-size="12.5" fill="#9ca3af">段落節點</text>
  <text x="152" y="182" text-anchor="middle" font-size="12.5" fill="#9ca3af">已完成撰寫</text>
  <text x="152" y="205" text-anchor="middle" font-size="11" fill="#b0b5bd">依序處理下一則</text>

  <!-- 箭頭：段落一 -> 段落二 -->
  <line x1="240" y1="179" x2="292" y2="179" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-gray-light)"/>

  <!-- 段落節點二：目前展開中，涉及具體案例或程式碼版本 -->
  <rect x="292" y="122" width="300" height="114" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
  <text x="442" y="150" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">目前展開中的段落節點</text>
  <text x="442" y="172" text-anchor="middle" font-size="12" fill="#4338ca">內容涉及具體案例或</text>
  <text x="442" y="192" text-anchor="middle" font-size="12" fill="#4338ca">程式碼版本，視需要觸發</text>
  <rect x="362" y="202" width="160" height="26" rx="13" fill="#4338ca"/>
  <text x="442" y="220" text-anchor="middle" font-size="11.5" fill="#ffffff">查閱回填迴圈</text>

  <!-- 箭頭：段落二 -> 段落三 -->
  <line x1="592" y1="179" x2="644" y2="179" stroke="#9ca3af" stroke-width="2.2" marker-end="url(#arrow-gray-light)"/>

  <!-- 段落節點三：待處理，虛化 -->
  <rect x="644" y="136" width="176" height="86" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="732" y="164" text-anchor="middle" font-size="12.5" fill="#9ca3af">下一則段落節點</text>
  <text x="732" y="182" text-anchor="middle" font-size="12.5" fill="#9ca3af">尚待處理</text>
  <text x="732" y="205" text-anchor="middle" font-size="11" fill="#b0b5bd">同樣依節奏展開</text>

  <!-- 省略號 -->
  <text x="862" y="185" font-size="20" font-weight="700" fill="#9ca3af">…</text>

  <!-- 連接線：從段落二節點向下拉出，進入放大迴圈區塊 -->
  <line x1="442" y1="236" x2="442" y2="278" stroke="#4338ca" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrow-indigo)"/>
  <text x="458" y="262" font-size="11.5" fill="#4338ca">同一節點內部放大檢視</text>

  <!-- 放大迴圈區塊外框，y: 284 ~ 760 -->
  <rect x="60" y="284" width="1040" height="476" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.6"/>
  <text x="580" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">段落節點內部：查閱與回填迴圈，圍繞同一份共享記錄運作</text>

  <!-- 共享記錄：全域錨點檔案，置於迴圈正中央偏下，y: 470 ~ 560 -->
  <rect x="440" y="470" width="280" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
  <text x="580" y="496" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">全域錨點檔案</text>
  <text x="580" y="516" text-anchor="middle" font-size="11.5" fill="#92400e">Day 05 單一事實來源的延伸</text>
  <text x="580" y="533" text-anchor="middle" font-size="11.5" fill="#92400e">持續累積，供查閱也供回填</text>

  <!-- 節點①查閱記錄，左上，y: 350 ~ 440 -->
  <rect x="100" y="350" width="230" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="100" y="350" width="230" height="34" rx="12" fill="#2563eb"/>
  <rect x="100" y="366" width="230" height="18" fill="#2563eb"/>
  <text x="215" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① 動筆前查閱</text>
  <text x="120" y="406" font-size="12" fill="#1e3a8a">確認案例或版本是否</text>
  <text x="120" y="424" font-size="12" fill="#1e3a8a">已出現過、已定義過</text>

  <!-- 箭頭 ①->共享記錄 -->
  <path d="M 230 440 L 440 495" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="300" y="460" font-size="11" fill="#2563eb">先查這裡</text>

  <!-- 節點②動筆撰寫，右上，y: 350 ~ 440 -->
  <rect x="830" y="350" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="830" y="350" width="230" height="34" rx="12" fill="#16a34a"/>
  <rect x="830" y="366" width="230" height="18" fill="#16a34a"/>
  <text x="945" y="371" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② 依查閱結果動筆</text>
  <text x="850" y="406" font-size="12" fill="#14532d">沿用一致的版本或</text>
  <text x="850" y="424" font-size="12" fill="#14532d">措辭展開這段內容</text>

  <!-- 箭頭 ①->②主線，查閱完成才動筆 -->
  <line x1="330" y1="395" x2="830" y2="395" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="580" y="382" text-anchor="middle" font-size="11" fill="#6b7280">查閱完成，確認無重複、版本一致，才動筆</text>

  <!-- 節點③完稿，右下，y: 600 ~ 690 -->
  <rect x="830" y="600" width="230" height="90" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="830" y="600" width="230" height="34" rx="12" fill="#ea580c"/>
  <rect x="830" y="616" width="230" height="18" fill="#ea580c"/>
  <text x="945" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">③ 這段內容完稿</text>
  <text x="850" y="656" font-size="12" fill="#7c2d12">引入新案例或新的</text>
  <text x="850" y="674" font-size="12" fill="#7c2d12">程式碼版本情境</text>

  <!-- 箭頭 ②->③ -->
  <line x1="945" y1="440" x2="945" y2="600" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <text x="961" y="515" font-size="11" fill="#6b7280">完成這段</text>
  <text x="961" y="531" font-size="11" fill="#6b7280">撰寫任務</text>

  <!-- 節點④回填記錄，左下，y: 600 ~ 690 -->
  <rect x="100" y="600" width="230" height="90" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <rect x="100" y="600" width="230" height="34" rx="12" fill="#db2777"/>
  <rect x="100" y="616" width="230" height="18" fill="#db2777"/>
  <text x="215" y="621" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">④ 完稿後回填</text>
  <text x="120" y="656" font-size="12" fill="#831843">把新引入的內容記</text>
  <text x="120" y="674" font-size="12" fill="#831843">一筆，供後續查閱</text>

  <!-- 箭頭 ③->④ -->
  <line x1="830" y1="645" x2="330" y2="645" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-gray)"/>
  <text x="580" y="632" text-anchor="middle" font-size="11" fill="#6b7280">完稿後，順手回填新內容</text>

  <!-- 箭頭 ④->共享記錄 -->
  <path d="M 330 615 L 440 545" fill="none" stroke="#db2777" stroke-width="2.2" marker-end="url(#arrow-pink)"/>
  <text x="345" y="590" font-size="11" fill="#db2777">寫回這裡</text>

  <!-- 底部說明：這整圈不是外加軌道，而是嵌在同一節點內部，置於迴圈外框內下緣，與節點③④下緣(690)間距22，與外框下緣(760)間距24 -->
  <text x="580" y="736" text-anchor="middle" font-size="12" fill="#4b5563">①②③④ 這一圈動作，從頭到尾都發生在同一個段落節點內部，查完才動筆、完稿才回填</text>

  <!-- 連接線：從迴圈外框下緣，回到主時間軸，呼應「同一條時間軸」，與外框下緣(760)間距0起算，下探至完成框頂緣(800)前留4間距 -->
  <path d="M 580 760 L 580 796" fill="none" stroke="#4338ca" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arrow-indigo)"/>

  <!-- 完成框，呼應回到時間軸繼續往下走，與外框下緣(760)間距40 -->
  <rect x="445" y="800" width="270" height="60" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
  <text x="580" y="824" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">迴圈結束，回到同一條</text>
  <text x="580" y="842" text-anchor="middle" font-size="12.5" font-weight="700" fill="#312e81">時間軸，繼續往下一段</text>

  <!-- 說明文字，完成框下緣(860)間距30 -->
  <text x="580" y="890" text-anchor="middle" font-size="12" fill="#6b7280">這一圈不是外加的另一條軌道，而是逐段展開節奏裡，遇到具體案例或版本時才會觸發的內部動作</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-gray-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
