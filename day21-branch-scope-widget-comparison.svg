<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="530" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">台北據點與高雄據點業務帳號登入後的 Widget 對照</text>

  <!-- 欄標籤 -->
  <text x="275" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">台北據點業務帳號登入</text>
  <text x="765" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">高雄據點業務帳號登入</text>

  <!-- 左側面板：台北 -->
  <rect x="60" y="98" width="430" height="390" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- 台北：統計卡片 -->
  <rect x="82" y="120" width="386" height="66" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="100" y="146" font-size="12.5" fill="#1e40af">本月訂單數，OrderStatsOverview</text>
  <text x="100" y="174" font-size="24" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">台北據點筆數</text>

  <!-- 台北：折線圖區塊 -->
  <rect x="82" y="206" width="386" height="228" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="100" y="228" font-size="12.5" fill="#1e40af">近七天訂單趨勢，OrderTrendChart</text>

  <!-- 台北折線圖座標軸 -->
  <line x1="112" y1="400" x2="440" y2="400" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="112" y1="248" x2="112" y2="400" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- 台北折線，示意走勢，僅表達趨勢，非精確數值 -->
  <polyline points="112,360 154,368 196,330 238,340 280,300 322,312 364,268 406,280 440,250"
            fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="112" cy="360" r="3.5" fill="#2563eb"/>
  <circle cx="196" cy="330" r="3.5" fill="#2563eb"/>
  <circle cx="280" cy="300" r="3.5" fill="#2563eb"/>
  <circle cx="364" cy="268" r="3.5" fill="#2563eb"/>
  <circle cx="440" cy="250" r="3.5" fill="#2563eb"/>

  <text x="112" y="416" font-size="11" fill="#6b7280">七天前</text>
  <text x="422" y="416" font-size="11" fill="#6b7280">今日</text>

  <text x="275" y="460" text-anchor="middle" font-size="12.5" fill="#1e40af">只計入台北據點的訂單</text>
  <text x="275" y="478" text-anchor="middle" font-size="12.5" fill="#1e40af">折線只反映台北據點近七天走勢</text>

  <!-- 右側面板：高雄 -->
  <rect x="550" y="98" width="430" height="390" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>

  <!-- 高雄：統計卡片 -->
  <rect x="572" y="120" width="386" height="66" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="590" y="146" font-size="12.5" fill="#9a3412">本月訂單數，OrderStatsOverview</text>
  <text x="590" y="174" font-size="24" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#7c2d12">高雄據點筆數</text>

  <!-- 高雄：折線圖區塊 -->
  <rect x="572" y="206" width="386" height="228" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="590" y="228" font-size="12.5" fill="#9a3412">近七天訂單趨勢，OrderTrendChart</text>

  <!-- 高雄折線圖座標軸 -->
  <line x1="602" y1="400" x2="930" y2="400" stroke="#fdba74" stroke-width="1.5"/>
  <line x1="602" y1="248" x2="602" y2="400" stroke="#fdba74" stroke-width="1.5"/>

  <!-- 高雄折線，示意走勢，與左側不同形狀，僅表達趨勢，非精確數值 -->
  <polyline points="602,300 644,286 686,320 728,304 770,344 812,326 854,360 896,340 930,372"
            fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <circle cx="602" cy="300" r="3.5" fill="#ea580c"/>
  <circle cx="686" cy="320" r="3.5" fill="#ea580c"/>
  <circle cx="770" cy="344" r="3.5" fill="#ea580c"/>
  <circle cx="854" cy="360" r="3.5" fill="#ea580c"/>
  <circle cx="930" cy="372" r="3.5" fill="#ea580c"/>

  <text x="602" y="416" font-size="11" fill="#6b7280">七天前</text>
  <text x="912" y="416" font-size="11" fill="#6b7280">今日</text>

  <text x="765" y="460" text-anchor="middle" font-size="12.5" fill="#9a3412">只計入高雄據點的訂單</text>
  <text x="765" y="478" text-anchor="middle" font-size="12.5" fill="#9a3412">折線只反映高雄據點近七天走勢</text>

  <!-- 底部說明 -->
  <text x="520" y="512" text-anchor="middle" font-size="13" fill="#6b7280">示意畫面，具體數字依實際資料而定，來源：Day 17 BranchScope 自動套用於 Order::query()</text>
</svg>
