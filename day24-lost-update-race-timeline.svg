<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">兩個請求，同一件僅剩的商品</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">先查詢再扣減，兩個步驟之間的時間差讓兩次扣減互相覆蓋，Semaphore 節流管不到這一層</text>
  <text x="60" y="175" text-anchor="start" font-size="14" fill="#1d4ed8" font-weight="700">請求 A</text>
  <text x="60" y="335" text-anchor="start" font-size="14" fill="#c2410c" font-weight="700">請求 B</text>
  <text x="60" y="464" text-anchor="start" font-size="14" fill="#1f2937" font-weight="700">資料庫</text>
  <text x="60" y="484" text-anchor="start" font-size="11.5" fill="#6b7280">庫存欄位</text>
  <line x1="170" y1="170" x2="1150" y2="170" stroke="#93c5fd" stroke-width="3"/>
  <line x1="170" y1="330" x2="1150" y2="330" stroke="#fdba74" stroke-width="3"/>
  <line x1="170" y1="470" x2="1150" y2="470" stroke="#d1d5db" stroke-width="3"/>
  <line x1="330" y1="110" x2="330" y2="560" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="330" y="104" text-anchor="middle" font-size="12.5" fill="#4b5563" font-weight="700">時間點 一</text>
  <line x1="540" y1="110" x2="540" y2="560" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="540" y="104" text-anchor="middle" font-size="12.5" fill="#4b5563" font-weight="700">時間點 二</text>
  <line x1="750" y1="110" x2="750" y2="560" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="750" y="104" text-anchor="middle" font-size="12.5" fill="#4b5563" font-weight="700">時間點 三</text>
  <line x1="960" y1="110" x2="960" y2="560" stroke="#e5e7eb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="960" y="104" text-anchor="middle" font-size="12.5" fill="#4b5563" font-weight="700">時間點 四</text>
  <rect x="238" y="140" width="184" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="330" y="164" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">查詢庫存，讀到 1</text>
  <text x="330" y="185" text-anchor="middle" font-size="11.5" fill="#4b5563">判斷可以購買</text>
  <rect x="448" y="300" width="184" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="540" y="324" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">查詢庫存，讀到 1</text>
  <text x="540" y="345" text-anchor="middle" font-size="11.5" fill="#4b5563">A 還沒寫回，判斷可以購買</text>
  <rect x="658" y="140" width="184" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="750" y="164" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">扣減：寫入 0</text>
  <text x="750" y="185" text-anchor="middle" font-size="11.5" fill="#4b5563">1 − 1 = 0</text>
  <rect x="868" y="300" width="184" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="960" y="324" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">扣減：寫入 0</text>
  <text x="960" y="345" text-anchor="middle" font-size="11.5" fill="#4b5563">依自己讀到的 1 計算</text>
  <rect x="176" y="450" width="568" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="460.0" y="476" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700" font-family="Menlo, Consolas, monospace">quantity = 1</text>
  <rect x="756" y="450" width="198" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="855.0" y="476" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700" font-family="Menlo, Consolas, monospace">quantity = 0</text>
  <rect x="966" y="450" width="178" height="40" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="1055.0" y="476" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700" font-family="Menlo, Consolas, monospace">quantity = 0</text>
  <path d="M 330 448 L 330 204" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#ar-indigo)"/>
  <path d="M 540 448 L 540 364" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#ar-amber)"/>
  <path d="M 750 202 L 750 446" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#ar-indigo)"/>
  <path d="M 960 362 L 960 446" stroke="#ea580c" stroke-width="2.2" fill="none" marker-end="url(#ar-amber)"/>
  <text x="338" y="410" text-anchor="start" font-size="11" fill="#1d4ed8">讀取</text>
  <text x="548" y="410" text-anchor="start" font-size="11" fill="#c2410c">讀取</text>
  <text x="758" y="410" text-anchor="start" font-size="11" fill="#1d4ed8">寫入</text>
  <text x="968" y="410" text-anchor="start" font-size="11" fill="#c2410c">寫入，覆蓋 A 的結果</text>
  <rect x="330" y="530" width="420" height="10" rx="3" fill="#fecaca"/>
  <text x="540.0" y="562" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">A 查詢到扣減之間的時間差，就是整個問題發生的空間</text>
  <rect x="130" y="590" width="940" height="100" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="620" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">兩個請求都回應「購買成功」，庫存卻只被記成扣了一次</text>
  <text x="600" y="646" text-anchor="middle" font-size="12.5" fill="#4b5563">正確結果應為 −1，代表賣超；資料表沒有保護機制時，欄位最後只停在 0</text>
  <text x="600" y="668" text-anchor="middle" font-size="12" fill="#6b7280">兩次扣減互相覆蓋，錯誤安安靜靜，要等對帳時才發現庫存與出貨紀錄對不上</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
