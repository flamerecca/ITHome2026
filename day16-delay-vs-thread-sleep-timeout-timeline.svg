<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="590" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">同一個 withTimeout(1_000)，delay 與 Thread.sleep 的結局差多少</text>
  <text x="590" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">兩條時間軸對照，逾時判定都發生在 1000ms，但取消訊號能不能生效，讓實際結束時間差了四秒</text>

  <!-- ===== 共用時間刻度尺：0 / 1000 / 5000ms，橫跨整張圖上緣，供兩條軸對齊 ===== -->
  <!-- 時間軸座標映射：0ms→150, 1000ms→330, 5000ms→1010，非等比，刻意放大 0~1000 區間以容納細節 -->
  <line x1="150" y1="112" x2="1010" y2="112" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="1030" y="117" font-size="12.5" fill="#6b7280">時間</text>

  <text x="150" y="98" text-anchor="middle" font-size="11.5" fill="#6b7280">0ms</text>
  <line x1="150" y1="104" x2="150" y2="120" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="330" y="98" text-anchor="middle" font-size="11.5" fill="#6b7280">1000ms</text>
  <line x1="330" y1="104" x2="330" y2="120" stroke="#9ca3af" stroke-width="1.5"/>

  <text x="1010" y="98" text-anchor="middle" font-size="11.5" fill="#6b7280">5000ms</text>
  <line x1="1010" y1="104" x2="1010" y2="120" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- ===== 1000ms 逾時判定豎線：貫穿兩條時間軸區域，統一標示 withTimeout 判定時間點 ===== -->
  <line x1="330" y1="160" x2="330" y2="186" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="330" y1="240" x2="330" y2="362" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="330" y1="510" x2="330" y2="652" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="7,5"/>
  <rect x="222" y="130" width="216" height="30" rx="15" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">withTimeout 於此判定逾時</text>

  <!-- ================= 上半：delay(5_000) 版本 ================= -->
  <text x="150" y="200" font-size="14.5" font-weight="700" fill="#1f2937">delay(5_000) 版本</text>
  <rect x="150" y="210" width="320" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="310" y="226" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">withTimeout(1_000) { delay(5_000) }</text>

  <!-- delay 版本時間軸主線 -->
  <line x1="150" y1="270" x2="330" y2="270" stroke="#22c55e" stroke-width="4"/>
  <circle cx="150" cy="270" r="7" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  <text x="150" y="256" text-anchor="middle" font-size="11" fill="#374151">開始 delay</text>

  <!-- 原本打算跑到 5000ms 的虛線殘影，代表若未被取消理論上會跑到哪 -->
  <line x1="330" y1="270" x2="1010" y2="270" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="670" y="256" text-anchor="middle" font-size="10.5" fill="#94a3b8">原本要暫停到 5000ms，但沒有機會跑到這裡</text>

  <!-- delay 版本在 1000ms 處被取消結束的節點與徽章 -->
  <circle cx="330" cy="270" r="8" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
  <rect x="356" y="286" width="230" height="76" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="471" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">約 1000ms 被取消結束</text>
  <text x="471" y="330" text-anchor="middle" font-size="10.5" fill="#374151">delay 在掛起點主動檢查</text>
  <text x="471" y="348" text-anchor="middle" font-size="10.5" fill="#374151">取消狀態，提早拋出例外</text>

  <!-- ================= 下半：Thread.sleep(5_000) 版本 ================= -->
  <text x="150" y="470" font-size="14.5" font-weight="700" fill="#1f2937">Thread.sleep(5_000) 版本</text>
  <rect x="150" y="480" width="360" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="496" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">withTimeout(1_000) { Thread.sleep(5_000) }</text>

  <!-- Thread.sleep 版本時間軸主線：實際整段執行緒被卡住，一路畫到 5000ms 才是真正結束點 -->
  <line x1="150" y1="560" x2="1010" y2="560" stroke="#ef4444" stroke-width="4"/>
  <circle cx="150" cy="560" r="7" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <text x="150" y="546" text-anchor="middle" font-size="11" fill="#374151">開始 Thread.sleep</text>

  <!-- 1000ms 處：逾時已判定，但訊號未生效的中繼標記 -->
  <circle cx="330" cy="560" r="8" fill="#fbbf24" stroke="#92400e" stroke-width="2.5"/>
  <rect x="356" y="576" width="230" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="471" y="600" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">逾時已判定，訊號晾在一旁</text>
  <text x="471" y="620" text-anchor="middle" font-size="10.5" fill="#92400e">Thread.sleep 不檢查取消，</text>
  <text x="471" y="638" text-anchor="middle" font-size="10.5" fill="#92400e">執行緒繼續被卡住</text>

  <!-- 5000ms 處：Thread.sleep 版本真正結束的節點與徽章 -->
  <circle cx="1010" cy="560" r="8" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
  <rect x="770" y="576" width="240" height="76" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="890" y="600" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">約 5000ms 才結束</text>
  <text x="890" y="620" text-anchor="middle" font-size="10.5" fill="#374151">睡滿五秒後才回頭補上</text>
  <text x="890" y="638" text-anchor="middle" font-size="10.5" fill="#374151">拋出取消例外，多等四秒</text>

  <!-- ===== 底部圖例 ===== -->
  <rect x="150" y="686" width="880" height="46" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="176" cy="709" r="6" fill="#22c55e" stroke="#14532d" stroke-width="2"/>
  <text x="192" y="713" font-size="11" fill="#374151">delay：suspend function，配合取消，提早結束</text>
  <circle cx="530" cy="709" r="6" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <text x="546" y="713" font-size="11" fill="#374151">Thread.sleep：阻塞呼叫，不理會取消，卡滿全程</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
