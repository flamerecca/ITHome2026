<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">這套系統接住的是機制性困難，判斷性困難留給人</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">依寫作任務裡兩種困難的佔比判斷適不適合，並標出人類在生產線上不可取代的三個位置</text>
  <rect x="400.0" y="320.0" width="280.0" height="210.0" fill="#e0e7ff"/>
  <rect x="120" y="110" width="280.0" height="210.0" fill="#fef3c7"/>
  <rect x="400.0" y="110" width="280.0" height="210.0" fill="#fef3c7"/>
  <rect x="120" y="320.0" width="280.0" height="210.0" fill="#f3f4f6"/>
  <line x1="120" y1="530" x2="690" y2="530" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <line x1="120" y1="530" x2="120" y2="100" stroke="#4b5563" stroke-width="1.6" marker-end="url(#ar-gray)"/>
  <line x1="400.0" y1="320.0" x2="400.0" y2="530" stroke="#ffffff" stroke-width="3"/>
  <line x1="120" y1="320.0" x2="680" y2="320.0" stroke="#ffffff" stroke-width="3"/>
  <text x="400.0" y="562" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">機制性困難的佔比 →</text>
  <text x="400.0" y="580" text-anchor="middle" font-size="10.5" fill="#6b7280">跨篇一致、程式碼可執行、陳述不過時、局部錯誤不牽動整體</text>
  <text x="80" y="320.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937" transform="rotate(-90 80 320.0)">判斷性困難的佔比 →</text>
  <text x="98" y="320.0" text-anchor="middle" font-size="10.5" fill="#6b7280" transform="rotate(-90 98 320.0)">值不值得寫、角度有無洞見、類比是否貼切</text>
  <rect x="412.0" y="332.0" width="256.0" height="186.0" rx="10" fill="none" stroke="#4338ca" stroke-width="2.4" stroke-dasharray="7 4"/>
  <text x="540.0" y="360.0" text-anchor="middle" font-size="13.5" fill="#312e81" font-weight="700">這套系統的作用範圍</text>
  <text x="540.0" y="382.0" text-anchor="middle" font-size="10.5" fill="#4338ca">判斷性決策已在系統外先由人類定案</text>
  <circle cx="440.0" cy="420.0" r="5" fill="#4338ca"/>
  <text x="454.0" y="424.0" text-anchor="start" font-size="11.5" fill="#312e81">連續多日的技術教學系列</text>
  <circle cx="440.0" cy="448.0" r="5" fill="#4338ca"/>
  <text x="454.0" y="452.0" text-anchor="start" font-size="11.5" fill="#312e81">內部技術文件、API 使用手冊</text>
  <circle cx="440.0" cy="476.0" r="5" fill="#4338ca"/>
  <text x="454.0" y="480.0" text-anchor="start" font-size="11.5" fill="#312e81">大量結構相似的教材改版</text>
  <text x="400.0" y="144" text-anchor="middle" font-size="13" fill="#78350f" font-weight="700">判斷性困難主導：不適合硬套這套系統</text>
  <circle cx="160" cy="180" r="5" fill="#d97706"/>
  <text x="174" y="184" text-anchor="start" font-size="11.5" fill="#78350f">需要犀利觀點的產業評論：一致性機制可能磨平稜角</text>
  <circle cx="160" cy="208" r="5" fill="#d97706"/>
  <text x="174" y="212" text-anchor="start" font-size="11.5" fill="#78350f">第一手經驗分享：查證機制無法驗證主觀經歷</text>
  <text x="400.0" y="260" text-anchor="middle" font-size="11" fill="#92400e">硬套的結果：流暢但空洞，破綻換一種更隱蔽的形式出現</text>
  <rect x="730" y="110" width="430" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.4"/>
  <text x="945" y="138" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700">人類在生產線上不可取代的三個位置</text>
  <line x1="780" y1="170" x2="780" y2="500" stroke="#c7d2fe" stroke-width="4"/>
  <circle cx="780" cy="186" r="11" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
  <text x="802" y="191" text-anchor="start" font-size="12.5" fill="#78350f" font-weight="700">① 生產線最前端：定義方向</text>
  <text x="802" y="214" text-anchor="start" font-size="11" fill="#4b5563">系統定位、風格指南、受眾畫像</text>
  <text x="802" y="232" text-anchor="start" font-size="11" fill="#4b5563">來自人類對主題與讀者的一手理解</text>
  <text x="802" y="250" text-anchor="start" font-size="11" fill="#6b7280">Day 08 到 Day 10</text>
  <circle cx="780" cy="296" r="11" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
  <text x="802" y="301" text-anchor="start" font-size="12.5" fill="#78350f" font-weight="700">② HITL 節點：把關重大決策</text>
  <text x="802" y="324" text-anchor="start" font-size="11" fill="#4b5563">系統判斷不出、或後果重大的節點，</text>
  <text x="802" y="342" text-anchor="start" font-size="11" fill="#4b5563">包括發佈前確認關卡</text>
  <text x="802" y="360" text-anchor="start" font-size="11" fill="#6b7280">Day 28、Day 33</text>
  <circle cx="780" cy="406" r="11" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
  <text x="802" y="411" text-anchor="start" font-size="12.5" fill="#78350f" font-weight="700">③ 審查後人工複核</text>
  <text x="802" y="434" text-anchor="start" font-size="11" fill="#4b5563">複核系統攔截不了的疏漏，</text>
  <text x="802" y="452" text-anchor="start" font-size="11" fill="#4b5563">機制降低的是錯誤機率，</text>
  <text x="802" y="470" text-anchor="start" font-size="11" fill="#6b7280">複核這件事依然必要</text>
  <text x="600" y="612" text-anchor="middle" font-size="12" fill="#6b7280">人類從逐字逐句校對，移到定義方向、把關重大決策、複核疏漏這幾個更高槓桿的節點</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
