<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">從一則佔位描述到一張架構圖：三層轉譯依序運作</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">視覺代理人只讀佔位描述裡已經點出的節點、關係、路徑分支，畫出它們，不重新詮釋</text>
  <rect x="40" y="100" width="300" height="250" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="190" y="126" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">輸入：一則圖表佔位描述</text>
  <rect x="58" y="140" width="264" height="160" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="70" y="162" text-anchor="start" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">&lt;!-- 圖表佔位：</text>
  <text x="70" y="181" text-anchor="start" font-size="11" fill="#334155">呈現寫作代理人在單一段落</text>
  <text x="70" y="200" text-anchor="start" font-size="11" fill="#334155">展開過程中，遇到程式碼片段時，</text>
  <text x="70" y="219" text-anchor="start" font-size="11" fill="#334155">查詢動作與執行驗證兩道關卡</text>
  <text x="70" y="238" text-anchor="start" font-size="11" fill="#334155">如何嵌入同一段落節點內部，</text>
  <text x="70" y="257" text-anchor="start" font-size="11" fill="#334155">並標示驗證未通過時回頭調整、</text>
  <text x="70" y="276" text-anchor="start" font-size="11" fill="#334155">通過才繼續往下一段的路徑 --&gt;</text>
  <text x="190" y="328" text-anchor="middle" font-size="11" fill="#6b7280">由規劃代理人或寫作代理人預留</text>
  <line x1="340" y1="225" x2="376" y2="225" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="380" y="100" width="240" height="250" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="380" y="100" width="240" height="34" rx="12" fill="#4338ca"/>
  <rect x="380" y="120" width="240" height="14" fill="#4338ca"/>
  <text x="500.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">① 判斷依據</text>
  <text x="396" y="158" text-anchor="start" font-size="11.5" fill="#312e81">描述裡是否明確點出</text>
  <text x="396" y="178" text-anchor="start" font-size="11.5" fill="#312e81">多個節點，以及節點之間的</text>
  <text x="396" y="198" text-anchor="start" font-size="11.5" fill="#312e81">先後或依附關係</text>
  <text x="396" y="218" text-anchor="start" font-size="11.5" fill="#312e81"></text>
  <text x="396" y="238" text-anchor="start" font-size="11.5" fill="#312e81">例：論證步驟、前提與結論、</text>
  <text x="396" y="258" text-anchor="start" font-size="11.5" fill="#312e81">步驟之間的銜接關係</text>
  <text x="396" y="278" text-anchor="start" font-size="11.5" fill="#312e81">→ 適合轉譯成流程圖</text>
  <rect x="640" y="100" width="240" height="250" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="640" y="100" width="240" height="34" rx="12" fill="#d97706"/>
  <rect x="640" y="120" width="240" height="14" fill="#d97706"/>
  <text x="760.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">② 轉譯輸入</text>
  <text x="656" y="158" text-anchor="start" font-size="11.5" fill="#78350f">只讀佔位描述裡已經點出的</text>
  <text x="656" y="178" text-anchor="start" font-size="11.5" fill="#78350f">節點、關係、路徑分支</text>
  <text x="656" y="198" text-anchor="start" font-size="11.5" fill="#78350f"></text>
  <text x="656" y="218" text-anchor="start" font-size="11.5" fill="#78350f">例：查詢與執行驗證兩道關卡，</text>
  <text x="656" y="238" text-anchor="start" font-size="11.5" fill="#78350f">未通過回頭調整的路徑</text>
  <text x="656" y="258" text-anchor="start" font-size="11.5" fill="#78350f"></text>
  <text x="656" y="278" text-anchor="start" font-size="11.5" fill="#78350f">不回頭重讀通篇正文猜畫面</text>
  <rect x="900" y="100" width="240" height="250" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="900" y="100" width="240" height="34" rx="12" fill="#16a34a"/>
  <rect x="900" y="120" width="240" height="14" fill="#16a34a"/>
  <text x="1020.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">③ 轉譯輸出</text>
  <text x="916" y="158" text-anchor="start" font-size="11.5" fill="#14532d">忠實呈現描述裡的</text>
  <text x="916" y="178" text-anchor="start" font-size="11.5" fill="#14532d">節點與關係</text>
  <text x="916" y="198" text-anchor="start" font-size="11.5" fill="#14532d"></text>
  <text x="916" y="218" text-anchor="start" font-size="11.5" fill="#14532d">例：查閱、動筆、完稿、回填</text>
  <text x="916" y="238" text-anchor="start" font-size="11.5" fill="#14532d">的迴圈，畫在同一條時間軸上</text>
  <text x="916" y="258" text-anchor="start" font-size="11.5" fill="#14532d"></text>
  <text x="916" y="278" text-anchor="start" font-size="11.5" fill="#14532d">取代佔位符原本所在的位置</text>
  <line x1="620" y1="225" x2="638" y2="225" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="880" y1="225" x2="898" y2="225" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <path d="M 500 350 L 500 392" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar-gray)"/>
  <rect x="395" y="396" width="210" height="54" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="500" y="418" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">線索不足，不轉譯成這類圖表</text>
  <text x="500" y="437" text-anchor="middle" font-size="10.5" fill="#6b7280">該交給哪種呈現，不在本篇範圍</text>
  <line x1="1020" y1="350" x2="1020" y2="392" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="880" y="396" width="280" height="74" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="422" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">一張架構圖</text>
  <text x="1020" y="443" text-anchor="middle" font-size="11" fill="#4b5563">節點與路徑與描述一一對應</text>
  <rect x="380" y="494" width="780" height="64" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="400" y="520" text-anchor="start" font-size="12.5" fill="#7f1d1d" font-weight="700">✕ 轉譯輸出的邊界</text>
  <text x="400" y="544" text-anchor="start" font-size="12" fill="#4b5563">不自行增減節點、不自行調整路徑方向；呼應 Day 21：不判斷論述邏輯、不修改正文</text>
  <path d="M 1020 470 L 1020 494" fill="none" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="600" y="600" text-anchor="middle" font-size="12" fill="#6b7280">範例佔位描述取自 Day 16 正文；三層的例子分別對應正文引用的 Day 18、Day 16、Day 17 佔位描述</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
