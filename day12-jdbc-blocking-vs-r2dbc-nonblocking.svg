<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="640" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">執行緒在等待資料庫回應時，是被卡住還是被釋放</text>
  <text x="640" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">傳統 JDBC 與 R2DBC 兩種資料庫存取方式，執行緒資源運用對照</text>

  <!-- ===== 左欄：傳統 JDBC，阻塞式 ===== -->
  <rect x="60" y="96" width="500" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="310" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">傳統 JDBC，阻塞式存取</text>

  <!-- 左 節點1：執行緒發出查詢 -->
  <rect x="110" y="166" width="400" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="310" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">執行緒發出查詢</text>
  <text x="310" y="212" text-anchor="middle" font-size="11.5" fill="#475569">送出一段 SQL 給資料庫</text>

  <line x1="310" y1="230" x2="310" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 左 節點2：原地等待，強調節點，紅框 -->
  <rect x="110" y="266" width="400" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="310" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">執行緒原地等待</text>
  <text x="310" y="310" text-anchor="middle" font-size="11.5" fill="#374151">資料庫處理查詢期間，執行緒停在</text>
  <text x="310" y="326" text-anchor="middle" font-size="11.5" fill="#374151">原地不動，什麼運算都沒有在做</text>
  <rect x="180" y="340" width="260" height="22" rx="11" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="310" y="355" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d">執行緒被獨佔，無法處理其他請求</text>

  <line x1="310" y1="370" x2="310" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 左 節點3：結果送回，才能繼續 -->
  <rect x="110" y="406" width="400" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">結果送回，才能繼續</text>
  <text x="310" y="452" text-anchor="middle" font-size="11.5" fill="#374151">直到資料庫回應抵達，執行緒才往下執行</text>

  <!-- ===== 右欄：R2DBC，非阻塞式 ===== -->
  <rect x="720" y="96" width="500" height="40" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="970" y="122" text-anchor="middle" font-size="14.5" font-weight="700" fill="#5b21b6">R2DBC，非阻塞式存取</text>

  <!-- 右 節點1：執行緒發出查詢 -->
  <rect x="770" y="166" width="400" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="970" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">執行緒發出查詢</text>
  <text x="970" y="212" text-anchor="middle" font-size="11.5" fill="#475569">以非阻塞方式送出查詢請求</text>

  <line x1="970" y1="230" x2="970" y2="266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 右 節點2：執行緒被釋放，強調節點，綠框，對齊左欄節點2 高度 104 -->
  <rect x="770" y="266" width="400" height="104" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="970" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">執行緒被釋放</text>
  <text x="970" y="310" text-anchor="middle" font-size="11.5" fill="#374151">不需要原地乾等，執行緒轉頭</text>
  <text x="970" y="326" text-anchor="middle" font-size="11.5" fill="#374151">去處理其他排隊中的工作</text>
  <rect x="810" y="340" width="320" height="22" rx="11" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="970" y="355" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">執行緒可轉去服務其他請求，不被獨佔</text>

  <line x1="970" y1="370" x2="970" y2="406" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 右 節點3：結果就緒，通知回來接手 -->
  <rect x="770" y="406" width="400" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="970" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">結果就緒，通知回來接手</text>
  <text x="970" y="452" text-anchor="middle" font-size="11.5" fill="#374151">資料庫準備好結果後，執行緒才被通知回來處理</text>

  <!-- 左欄補一段對齊用的間距說明，讓左右底部一起連到共同邊界容器 -->
  <line x1="310" y1="470" x2="310" y2="570" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,4"/>
  <text x="330" y="516" text-anchor="start" font-size="10.5" fill="#94a3b8">此路徑僅三步驟，提前完成</text>

  <line x1="970" y1="470" x2="970" y2="570" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,4"/>

  <!-- 連接兩欄底部到共同結論框 -->
  <line x1="310" y1="570" x2="310" y2="606" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-gray)"/>
  <line x1="970" y1="570" x2="970" y2="606" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-gray)"/>

  <!-- ===== 共同結論：執行緒資源運用上的本質差異，橫跨兩欄 ===== -->
  <rect x="110" y="614" width="1060" height="96" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="640" y="644" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">本質差異：等待資料庫回應期間，執行緒是被卡住還是被釋放</text>
  <text x="640" y="670" text-anchor="middle" font-size="11.5" fill="#4338ca">左側執行緒在等待期間完全無法挪作他用，右側執行緒在等待期間可轉去服務其他請求，</text>
  <text x="640" y="690" text-anchor="middle" font-size="11.5" fill="#4338ca">同樣是等待資料庫，執行緒資源的占用方式完全不同</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
