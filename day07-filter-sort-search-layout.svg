<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="480" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">商品列表頁，排序、篩選、搜尋的實際位置</text>

  <!-- 整體畫面外框 -->
  <rect x="60" y="70" width="920" height="370" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 篩選與搜尋列（頁首上方） -->
  <rect x="80" y="90" width="880" height="70" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="100" y="112" font-size="13" font-weight="600" fill="#78350f">篩選 Filters</text>

  <rect x="100" y="122" width="160" height="30" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="180" y="142" text-anchor="middle" font-size="12" fill="#78350f">分類 ▾</text>

  <rect x="272" y="122" width="160" height="30" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="352" y="142" text-anchor="middle" font-size="12" fill="#78350f">上架狀態 ▾</text>

  <rect x="444" y="122" width="200" height="30" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="544" y="142" text-anchor="middle" font-size="12" fill="#78350f">價格區間 最低 ~ 最高</text>

  <rect x="656" y="122" width="284" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="798" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">🔍 搜尋商品名稱片段</text>

  <!-- 表格標題列（排序） -->
  <rect x="80" y="172" width="880" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="105" y="198" font-size="12.5" font-weight="700" fill="#14532d">商品名稱</text>
  <text x="230" y="198" font-size="12.5" font-weight="700" fill="#14532d">價格 ▲▼</text>
  <text x="340" y="198" font-size="12.5" font-weight="700" fill="#14532d">庫存數量 ▲▼</text>
  <text x="480" y="198" font-size="12.5" font-weight="700" fill="#14532d">進貨日期 ▲▼</text>
  <text x="620" y="198" font-size="12.5" font-weight="700" fill="#14532d">分類</text>
  <text x="740" y="198" font-size="12.5" font-weight="700" fill="#14532d">上架狀態</text>

  <!-- 表格資料列示意 -->
  <rect x="80" y="214" width="880" height="34" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="80" y="248" width="880" height="34" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="80" y="282" width="880" height="34" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="105" y="236" font-size="11.5" fill="#6b7280">寵物潔牙骨 S 號</text>
  <text x="105" y="270" font-size="11.5" fill="#6b7280">寵物潔牙骨 M 號</text>
  <text x="105" y="304" font-size="11.5" fill="#6b7280">貓籠 加大款</text>

  <!-- 標註說明區 -->
  <rect x="80" y="330" width="270" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="100" y="352" font-size="13" font-weight="700" fill="#1e3a8a">排序</text>
  <text x="100" y="372" font-size="11.5" fill="#374151">欄位標題可點擊</text>
  <text x="100" y="390" font-size="11.5" fill="#374151">決定整份列表出場順序</text>
  <text x="100" y="408" font-size="11.5" fill="#374151">價格、庫存、進貨日期</text>

  <rect x="380" y="330" width="270" height="90" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="400" y="352" font-size="13" font-weight="700" fill="#78350f">篩選</text>
  <text x="400" y="372" font-size="11.5" fill="#374151">頁首下拉與區間輸入</text>
  <text x="400" y="390" font-size="11.5" fill="#374151">先排除不相關資料</text>
  <text x="400" y="408" font-size="11.5" fill="#374151">分類、上架狀態、價格區間</text>

  <rect x="680" y="330" width="280" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="700" y="352" font-size="13" font-weight="700" fill="#14532d">搜尋</text>
  <text x="700" y="372" font-size="11.5" fill="#374151">頁首搜尋輸入框</text>
  <text x="700" y="390" font-size="11.5" fill="#374151">用名稱片段模糊定位</text>
  <text x="700" y="408" font-size="11.5" fill="#374151">商品名稱關鍵字</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
