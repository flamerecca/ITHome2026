<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">p95 回應時間：低併發幾乎重疊，高併發明顯分岔</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">Thread-per-Request 對照協程 + WebFlux + R2DBC，流量爬升到促銷尖峰之後差距才被放大</text>
  <rect x="120.0" y="120" width="240.0" height="400" fill="#f3f4f6"/>
  <text x="240.0" y="140" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">低併發，日常流量</text>
  <rect x="680.0" y="120" width="320.0" height="400" fill="#fde2d3"/>
  <text x="840.0" y="140" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">高併發，促銷尖峰</text>
  <line x1="120" y1="520.0" x2="1000" y2="520.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="524.0" text-anchor="end" font-size="11" fill="#6b7280">0 ms</text>
  <line x1="120" y1="453.33333333333337" x2="1000" y2="453.33333333333337" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="457.33333333333337" text-anchor="end" font-size="11" fill="#6b7280">400 ms</text>
  <line x1="120" y1="386.6666666666667" x2="1000" y2="386.6666666666667" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="390.6666666666667" text-anchor="end" font-size="11" fill="#6b7280">800 ms</text>
  <line x1="120" y1="320.0" x2="1000" y2="320.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="324.0" text-anchor="end" font-size="11" fill="#6b7280">1200 ms</text>
  <line x1="120" y1="253.33333333333337" x2="1000" y2="253.33333333333337" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="257.33333333333337" text-anchor="end" font-size="11" fill="#6b7280">1600 ms</text>
  <line x1="120" y1="186.66666666666663" x2="1000" y2="186.66666666666663" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="190.66666666666663" text-anchor="end" font-size="11" fill="#6b7280">2000 ms</text>
  <line x1="120" y1="120.0" x2="1000" y2="120.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="110" y="124.0" text-anchor="end" font-size="11" fill="#6b7280">2400 ms</text>
  <line x1="120" y1="520" x2="1000" y2="520" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="200.0" y1="520" x2="200.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="200.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">20</text>
  <line x1="320.0" y1="520" x2="320.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="320.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">50</text>
  <line x1="520.0" y1="520" x2="520.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="520.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">100</text>
  <line x1="720.0" y1="520" x2="720.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="720.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">150</text>
  <line x1="920.0" y1="520" x2="920.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="920.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">200</text>
  <text x="120" y="106" text-anchor="start" font-size="11.5" fill="#4b5563" font-weight="700">p95 回應時間，示意</text>
  <text x="560.0" y="562" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">併發虛擬使用者數量 VUs</text>
  <path d="M 200.0 505.0 L 320.0 493.3 L 520.0 440.0 L 720.0 328.3 L 920.0 170.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="200.0" cy="505.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <circle cx="320.0" cy="493.3" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <circle cx="520.0" cy="440.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <circle cx="720.0" cy="328.3" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <circle cx="920.0" cy="170.0" r="4.5" fill="#eb6834" stroke="#ffffff" stroke-width="2"/>
  <path d="M 200.0 504.2 L 320.0 500.8 L 520.0 488.3 L 720.0 471.7 L 920.0 450.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="200.0" cy="504.2" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="320.0" cy="500.8" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="520.0" cy="488.3" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="720.0" cy="471.7" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <circle cx="920.0" cy="450.0" r="4.5" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
  <text x="934.0" y="174.0" text-anchor="start" font-size="12" fill="#1f2937" font-weight="700">Thread-per-Request</text>
  <text x="934.0" y="192.0" text-anchor="start" font-size="11.5" fill="#4b5563">2100 ms，陡升</text>
  <text x="934.0" y="454.0" text-anchor="start" font-size="12" fill="#1f2937" font-weight="700">協程 + WebFlux</text>
  <text x="934.0" y="472.0" text-anchor="start" font-size="11.5" fill="#4b5563">+ R2DBC，420 ms</text>
  <line x1="208.0" y1="464.1666666666667" x2="202.0" y2="494.1666666666667" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="208.0" y="458.1666666666667" text-anchor="start" font-size="11.5" fill="#4b5563">低併發兩線接近，協程 95 ms 略高於 90 ms</text>
  <line x1="140" y1="216" x2="162" y2="216" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="220" text-anchor="start" font-size="12" fill="#4b5563">Thread-per-Request</text>
  <line x1="140" y1="238" x2="162" y2="238" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="242" text-anchor="start" font-size="12" fill="#4b5563">協程 + WebFlux + R2DBC</text>
  <text x="600" y="600" text-anchor="middle" font-size="12" fill="#6b7280">示意數據：20 與 200 VUs 兩端取自正文表格，中間各點為示意走勢，並非實測結果</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
