<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">AdminPanelProvider 設定檔與 Panel 四個面向對照</text>

  <!-- 欄標籤 -->
  <text x="255" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">鏈式呼叫方法</text>
  <text x="785" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">Panel 錨點定義的面向</text>

  <!-- ===== Row 1：入口識別 ===== -->
  <rect x="60" y="100" width="390" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="80" y="130" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">id('admin')</text>
  <text x="80" y="152" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">path('admin')</text>

  <line x1="450" y1="136" x2="590" y2="136" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="100" width="390" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="785" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">入口識別</text>
  <text x="785" y="150" text-anchor="middle" font-size="12.5" fill="#374151">這個 Panel 是誰、網址是什麼</text>

  <!-- ===== Row 2：外觀主題 ===== -->
  <rect x="60" y="192" width="390" height="72" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="80" y="234" font-size="15" font-family="Menlo, Consolas, monospace" fill="#14532d">colors([...])</text>

  <line x1="450" y1="228" x2="590" y2="228" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="192" width="390" height="72" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="785" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">外觀主題</text>
  <text x="785" y="242" text-anchor="middle" font-size="12.5" fill="#374151">這個入口長什麼樣子</text>

  <!-- ===== Row 3：內容範圍 ===== -->
  <rect x="60" y="284" width="390" height="90" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="80" y="312" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#78350f">discoverResources(...)</text>
  <text x="80" y="334" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#78350f">discoverPages(...)</text>
  <text x="80" y="356" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#78350f">discoverWidgets(...)</text>

  <line x1="450" y1="329" x2="590" y2="329" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="284" width="390" height="90" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="785" y="316" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">內容範圍</text>
  <text x="785" y="340" text-anchor="middle" font-size="12.5" fill="#374151">這個入口底下有哪些</text>
  <text x="785" y="358" text-anchor="middle" font-size="12.5" fill="#374151">Resource、Page、Widget</text>

  <!-- ===== Row 4：存取範圍 ===== -->
  <rect x="60" y="394" width="390" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="80" y="424" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">middleware([...])</text>
  <text x="80" y="446" font-size="14.5" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">authMiddleware([...])</text>

  <line x1="450" y1="430" x2="590" y2="430" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="590" y="394" width="390" height="72" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="785" y="422" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">存取範圍</text>
  <text x="785" y="444" text-anchor="middle" font-size="12.5" fill="#374151">誰有資格進到這個入口</text>

  <!-- 底部說明 -->
  <text x="520" y="500" text-anchor="middle" font-size="13" fill="#6b7280">來源：app/Providers/Filament/AdminPanelProvider.php 的 panel() 鏈式呼叫設定</text>
  <text x="520" y="522" text-anchor="middle" font-size="13" fill="#6b7280">Panel 是後台入口的最上層容器，這四個面向共同構成一個完整的 Panel 定義</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
