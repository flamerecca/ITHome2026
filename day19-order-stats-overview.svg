<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="480" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Panel 首頁，OrderStatsOverview 掛載後</text>
  <text x="520" y="64" text-anchor="middle" font-size="13" fill="#6b7280">兩張統計數字卡片並排顯示在首頁最上方，卡片版面示意，數字以色塊代表非實際資料</text>

  <!-- 瀏覽器窗框，示意這是首頁截圖 -->
  <rect x="60" y="90" width="920" height="330" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="60" y="90" width="920" height="32" rx="10" fill="#e5e7eb"/>
  <rect x="60" y="106" width="920" height="16" fill="#e5e7eb"/>
  <circle cx="80" cy="106" r="5" fill="#f87171"/>
  <circle cx="98" cy="106" r="5" fill="#fbbf24"/>
  <circle cx="116" cy="106" r="5" fill="#34d399"/>
  <text x="520" y="111" text-anchor="middle" font-size="11" fill="#6b7280">寵物用品批發商後台 / 首頁</text>

  <!-- 左卡片，本月訂單數 -->
  <rect x="96" y="150" width="424" height="240" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="124" y="186" font-size="15" font-weight="600" fill="#374151">本月訂單數</text>
  <rect x="124" y="212" width="90" height="40" rx="6" fill="#e5e7eb"/>
  <text x="169" y="238" text-anchor="middle" font-size="13" fill="#9ca3af">示意值</text>
  <line x1="124" y1="296" x2="492" y2="296" stroke="#f3f4f6"/>
  <text x="124" y="326" font-size="13" fill="#6b7280">統計本月建立的訂單筆數</text>

  <!-- 右卡片，待處理訂單數 -->
  <rect x="520" y="150" width="424" height="240" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="548" y="186" font-size="15" font-weight="600" fill="#374151">待處理訂單數</text>
  <circle cx="916" cy="180" r="12" fill="#fef3c7"/>
  <text x="916" y="185" text-anchor="middle" font-size="14" fill="#b45309">!</text>
  <rect x="548" y="212" width="90" height="40" rx="6" fill="#fde68a"/>
  <text x="593" y="238" text-anchor="middle" font-size="13" fill="#92400e">示意值</text>
  <line x1="548" y1="296" x2="916" y2="296" stroke="#fef3c7"/>
  <text x="548" y="326" font-size="13" fill="#92400e">尚未確認或出貨的訂單</text>

  <!-- 底部說明 -->
  <text x="520" y="460" text-anchor="middle" font-size="13" fill="#6b7280">來源：Day 19 OrderStatsOverview 的 Stat::make 兩個統計項目，掛載於 app/Filament/Widgets</text>
</svg>
