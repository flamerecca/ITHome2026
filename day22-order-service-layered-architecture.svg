<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">訂單服務實戰整合版的分層骨架</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">Controller、Service、Repository 各司其職，是 Day 23 到 Day 30 所有程式碼片段共同依循的地基</text>
  <rect x="110" y="100" width="620" height="140" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="110" y="100" width="620" height="34" rx="12" fill="#4338ca"/>
  <rect x="110" y="120" width="620" height="14" fill="#4338ca"/>
  <text x="420.0" y="122" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="700">Controller 層</text>
  <text x="128" y="160" text-anchor="start" font-size="12" fill="#312e81" font-family="Menlo, Consolas, monospace">OrderController.getOrder(orderId)</text>
  <text x="128" y="181" text-anchor="start" font-size="12" fill="#4b5563">接收 HTTP 請求，轉交 Service，把結果包裝成回應送回去</text>
  <text x="128" y="202" text-anchor="start" font-size="12" fill="#4b5563">不放任何業務邏輯</text>
  <rect x="110" y="290" width="620" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="110" y="290" width="620" height="34" rx="12" fill="#ea580c"/>
  <rect x="110" y="310" width="620" height="14" fill="#ea580c"/>
  <text x="420.0" y="312" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="700">Service 層</text>
  <text x="128" y="350" text-anchor="start" font-size="12" fill="#7c2d12" font-family="Menlo, Consolas, monospace">OrderService.getOrderDetail(orderId)</text>
  <text x="128" y="371" text-anchor="start" font-size="12" fill="#4b5563">業務邏輯本身：問過資料庫與庫存服務，組裝完整回應</text>
  <text x="128" y="392" text-anchor="start" font-size="12" fill="#4b5563">協程編排落在這一層：平行呼叫、節流、逾時控制</text>
  <rect x="110" y="480" width="620" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="110" y="480" width="620" height="34" rx="12" fill="#16a34a"/>
  <rect x="110" y="500" width="620" height="14" fill="#16a34a"/>
  <text x="420.0" y="502" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="700">Repository 層</text>
  <text x="128" y="540" text-anchor="start" font-size="12" fill="#14532d" font-family="Menlo, Consolas, monospace">OrderRepository : CoroutineCrudRepository&lt;Order, Long&gt;</text>
  <text x="128" y="561" text-anchor="start" font-size="12" fill="#4b5563">資料庫存取，沿用 Day 12 的 Spring Data R2DBC 寫法</text>
  <text x="128" y="582" text-anchor="start" font-size="12" fill="#4b5563">內建 suspend 的 findById，等待資料庫時協程暫停</text>
  <line x1="420.0" y1="240" x2="420.0" y2="286" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="432.0" y="268" text-anchor="start" font-size="11" fill="#6b7280">suspend 呼叫</text>
  <line x1="420.0" y1="430" x2="420.0" y2="476" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="432.0" y="458" text-anchor="start" font-size="11" fill="#6b7280" font-family="Menlo, Consolas, monospace">findById</text>
  <rect x="230" y="650" width="380" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="420" y="674" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">PostgreSQL</text>
  <text x="420" y="694" text-anchor="middle" font-size="11.5" fill="#4b5563">透過 R2DBC 非阻塞連線存取</text>
  <line x1="420.0" y1="620" x2="420.0" y2="646" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="30" y="320" width="0" height="0" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
  <rect x="770" y="318" width="170" height="84" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="855" y="350" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700" font-family="Menlo, Consolas, monospace">StockClient</text>
  <text x="855" y="372" text-anchor="middle" font-size="11.5" fill="#4b5563">確認庫存的</text>
  <text x="855" y="390" text-anchor="middle" font-size="11.5" fill="#4b5563">下游內部服務</text>
  <line x1="730" y1="360" x2="766" y2="360" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="770" y="150" width="330" height="140" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="935" y="182" text-anchor="middle" font-size="13.5" fill="#92400e" font-weight="700">後續八天的擴充都加在這一層</text>
  <text x="790" y="212" text-anchor="start" font-size="11.5" fill="#4b5563">Day 23　併發控制：Semaphore、withTimeout</text>
  <text x="790" y="232" text-anchor="start" font-size="11.5" fill="#4b5563">Day 24　資料庫交易機制：樂觀鎖、悲觀鎖</text>
  <text x="790" y="252" text-anchor="start" font-size="11.5" fill="#4b5563">Day 25、26　可觀測性：日誌關聯、Metrics</text>
  <text x="790" y="272" text-anchor="start" font-size="11.5" fill="#6b7280">方法簽章與分層方式不再更動</text>
  <path d="M 770 270 L 734 320" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#ar-amber)"/>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
