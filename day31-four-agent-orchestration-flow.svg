<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">四類 Agent 的編排流程：在 Day 03 的每一個箭頭上裝訊號燈</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">觸發靠完成旗標、協同靠進度標記、介入靠雙方完成狀態，規格問題打回後依修正範圍決定保留或重做</text>
  <rect x="40" y="100" width="210" height="130" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="40" y="100" width="210" height="34" rx="12" fill="#4338ca"/>
  <rect x="40" y="120" width="210" height="14" fill="#4338ca"/>
  <text x="145.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">規劃代理人</text>
  <text x="56" y="158" text-anchor="start" font-size="12" fill="#312e81">產出 Section Spec</text>
  <text x="56" y="178" text-anchor="start" font-size="12" fill="#312e81">寫入共享位置</text>
  <text x="56" y="198" text-anchor="start" font-size="12" fill="#312e81">標記完成狀態旗標</text>
  <rect x="290" y="128" width="150" height="74" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="365" y="155" text-anchor="middle" font-size="12.5" fill="#78350f" font-weight="700">完成旗標</text>
  <text x="365" y="177" text-anchor="middle" font-size="11" fill="#4b5563">下游監看到才動工</text>
  <line x1="250" y1="165" x2="288" y2="165" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="440" y1="150" x2="488" y2="140" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="440" y1="180" x2="488" y2="250" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="490" y="96" width="220" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="490" y="96" width="220" height="34" rx="12" fill="#16a34a"/>
  <rect x="490" y="116" width="220" height="14" fill="#16a34a"/>
  <text x="600.0" y="118" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">寫作代理人</text>
  <text x="506" y="154" text-anchor="start" font-size="12" fill="#14532d">逐段完成後更新進度標記</text>
  <rect x="490" y="206" width="220" height="100" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <rect x="490" y="206" width="220" height="34" rx="12" fill="#db2777"/>
  <rect x="490" y="226" width="220" height="14" fill="#db2777"/>
  <text x="600.0" y="228" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">視覺代理人</text>
  <text x="506" y="264" text-anchor="start" font-size="12" fill="#831843">依已成形內容產出素材</text>
  <text x="506" y="284" text-anchor="start" font-size="12" fill="#831843">描述不足時標記等待狀態</text>
  <rect x="730" y="110" width="170" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="815" y="136" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">共用進度看板</text>
  <text x="815" y="162" text-anchor="middle" font-size="11" fill="#4b5563">寫作：第 3 段完成</text>
  <text x="815" y="181" text-anchor="middle" font-size="11" fill="#4b5563">視覺：圖 1 完成</text>
  <text x="815" y="200" text-anchor="middle" font-size="11" fill="#4b5563">視覺：第 4 段等待</text>
  <text x="815" y="219" text-anchor="middle" font-size="11" fill="#6b7280">互相參照，</text>
  <text x="815" y="238" text-anchor="middle" font-size="11" fill="#6b7280">不改對方的產出</text>
  <path d="M 710 140 L 728 156" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar-gray)"/>
  <path d="M 710 250 L 728 220" fill="none" stroke="#db2777" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar-gray)"/>
  <line x1="900" y1="185" x2="938" y2="185" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="940" y="120" width="220" height="130" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="940" y="120" width="220" height="34" rx="12" fill="#ea580c"/>
  <rect x="940" y="140" width="220" height="14" fill="#ea580c"/>
  <text x="1050.0" y="142" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">審查代理人</text>
  <text x="956" y="178" text-anchor="start" font-size="12" fill="#7c2d12">監看寫作與視覺兩者</text>
  <text x="956" y="198" text-anchor="start" font-size="12" fill="#7c2d12">都標記完成，</text>
  <text x="956" y="218" text-anchor="start" font-size="12" fill="#7c2d12">才開始介入查核</text>
  <path d="M 1050 250 L 1050 330" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-red)"/>
  <text x="1062" y="296" text-anchor="start" font-size="11.5" fill="#7f1d1d" font-weight="700">查出問題，打回</text>
  <rect x="760" y="334" width="400" height="96" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="960" y="358" text-anchor="middle" font-size="12.5" fill="#7f1d1d" font-weight="700">修正方向一律回頭指向對應的上游角色</text>
  <text x="960" y="382" text-anchor="middle" font-size="11.5" fill="#4b5563">內容問題 → 寫作代理人　視覺問題 → 視覺代理人</text>
  <text x="960" y="404" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">規格層級問題 → 規劃代理人</text>
  <path d="M 760 404 L 300 404 L 300 482" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>
  <text x="530" y="396" text-anchor="middle" font-size="11.5" fill="#7f1d1d" font-weight="700">規格問題打回後，前面做的還算不算數</text>
  <polygon points="300,486 410,530 300,574 190,530" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="300" y="526" text-anchor="middle" font-size="12" fill="#78350f" font-weight="700">依修正範圍</text>
  <text x="300" y="544" text-anchor="middle" font-size="12" fill="#78350f" font-weight="700">決定處置</text>
  <line x1="410" y1="530" x2="470" y2="500" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="410" y1="530" x2="470" y2="566" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="474" y="470" width="340" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="644" y="494" text-anchor="middle" font-size="12" fill="#14532d" font-weight="700">局限在特定段落單元 → 局部保留</text>
  <text x="644" y="514" text-anchor="middle" font-size="11" fill="#4b5563">只重做受影響段落，其餘產出保留</text>
  <rect x="474" y="540" width="340" height="58" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="644" y="564" text-anchor="middle" font-size="12" fill="#7c2d12" font-weight="700">擴及核心目標或整體結構</text>
  <text x="644" y="584" text-anchor="middle" font-size="11" fill="#4b5563">才考慮較大範圍甚至整篇重新展開</text>
  <text x="40" y="460" text-anchor="start" font-size="11.5" fill="#4b5563" font-weight="700">執行主體仍是四類既有 Agent</text>
  <text x="40" y="478" text-anchor="start" font-size="11.5" fill="#4b5563">沒有第五個調度者</text>
  <text x="990" y="470" text-anchor="middle" font-size="11" fill="#6b7280">可行的前提：規格從一開始</text>
  <text x="990" y="488" text-anchor="middle" font-size="11" fill="#6b7280">就拆成具備獨立邊界的段落單元</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
