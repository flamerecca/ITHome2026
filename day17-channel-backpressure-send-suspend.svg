<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1180" height="740" fill="#ffffff"/>

  <text x="590" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">背壓運作：Channel 已滿時，send 是暫停而非阻塞</text>
  <text x="590" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">供應商事件來源、容量 100 的 Channel、訂單服務消費協程，消費端取走一筆事件後，生產端才恢復執行</text>

  <!-- ===== 上排：三個角色 ===== -->
  <!-- 生產端 -->
  <rect x="60" y="100" width="240" height="190" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="180" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">供應商事件來源</text>
  <text x="180" y="152" text-anchor="middle" font-size="10.5" fill="#6b7280">生產端，持續回報庫存異動事件</text>
  <text x="180" y="190" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">receiveEvent(event)</text>
  <text x="180" y="210" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">stockEventChannel.send(event)</text>
  <rect x="80" y="238" width="200" height="30" rx="15" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="180" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">send 暫停等待中</text>

  <!-- Channel -->
  <rect x="470" y="100" width="240" height="190" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="590" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">stockEventChannel</text>
  <text x="590" y="152" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">Channel(capacity = 100)</text>
  <g fill="#fca5a5" stroke="#ef4444" stroke-width="1.2">
    <rect x="492" y="172" width="16" height="22" rx="3"/>
    <rect x="512" y="172" width="16" height="22" rx="3"/>
    <rect x="532" y="172" width="16" height="22" rx="3"/>
    <rect x="552" y="172" width="16" height="22" rx="3"/>
    <rect x="572" y="172" width="16" height="22" rx="3"/>
    <rect x="592" y="172" width="16" height="22" rx="3"/>
    <rect x="612" y="172" width="16" height="22" rx="3"/>
    <rect x="632" y="172" width="16" height="22" rx="3"/>
    <rect x="652" y="172" width="16" height="22" rx="3"/>
    <rect x="672" y="172" width="16" height="22" rx="3"/>
  </g>
  <text x="590" y="216" text-anchor="middle" font-size="10.5" fill="#92400e">緩衝區已滿 100 / 100，沒有空位</text>
  <rect x="490" y="240" width="200" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590" y="260" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">容量上限是背壓的煞車</text>

  <!-- 消費端 -->
  <rect x="880" y="100" width="240" height="190" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1000" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">訂單服務消費協程</text>
  <text x="1000" y="152" text-anchor="middle" font-size="10.5" fill="#6b7280">消費端，寫入資料庫更新庫存</text>
  <text x="1000" y="190" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">for (event in stockEventChannel)</text>
  <text x="1000" y="210" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#334155">updateStockInDatabase(event)</text>
  <rect x="900" y="238" width="200" height="30" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1000" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">逐筆處理，速度較慢</text>

  <!-- 上排箭頭 -->
  <line x1="300" y1="200" x2="468" y2="200" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="384" y="186" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#374151">send(event)</text>
  <line x1="710" y1="200" x2="878" y2="200" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="794" y="186" text-anchor="middle" font-size="11" fill="#374151">逐筆取出事件</text>

  <!-- Channel 到因果流程 -->
  <line x1="590" y1="290" x2="590" y2="342" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <rect x="410" y="344" width="360" height="32" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="365" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">當 Channel 已滿時的因果流程</text>

  <!-- ===== 因果四步 ===== -->
  <rect x="60" y="410" width="230" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="86" cy="438" r="12" fill="#f59e0b"/>
  <text x="86" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="176" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Channel 已滿</text>
  <text x="175" y="472" text-anchor="middle" font-size="10.5" fill="#92400e">緩衝區 100 筆全數佔滿</text>
  <text x="175" y="492" text-anchor="middle" font-size="10.5" fill="#92400e">消費端還沒取走任何一筆</text>

  <rect x="336" y="410" width="230" height="100" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="362" cy="438" r="12" fill="#ef4444"/>
  <text x="362" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="458" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">send 被暫停 suspend</text>
  <text x="451" y="472" text-anchor="middle" font-size="10.5" fill="#374151">生產端協程暫停在 send</text>
  <text x="451" y="492" text-anchor="middle" font-size="10.5" fill="#374151">後續 receiveEvent 也跟著等</text>

  <rect x="612" y="410" width="230" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="638" cy="438" r="12" fill="#3b82f6"/>
  <text x="638" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="737" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">消費協程取出一筆事件</text>
  <text x="727" y="472" text-anchor="middle" font-size="10.5" fill="#374151">for 迴圈取走一筆事件</text>
  <text x="727" y="492" text-anchor="middle" font-size="10.5" fill="#374151">Channel 空出一個位置</text>

  <rect x="888" y="410" width="230" height="100" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="914" cy="438" r="12" fill="#22c55e"/>
  <text x="914" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="1013" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">生產端恢復執行</text>
  <text x="1003" y="472" text-anchor="middle" font-size="10.5" fill="#374151">send 完成，繼續放入下一筆</text>
  <text x="1003" y="492" text-anchor="middle" font-size="10.5" fill="#374151">速度被迫配合消費端</text>

  <line x1="290" y1="460" x2="334" y2="460" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <line x1="566" y1="460" x2="610" y2="460" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <line x1="842" y1="460" x2="886" y2="460" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- ===== 重點對照：suspend 不是 block ===== -->
  <rect x="60" y="548" width="1060" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="590" y="580" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f2937">重點：send 是 suspend 暫停，不是 block 阻塞執行緒</text>

  <rect x="90" y="602" width="470" height="84" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="325" y="628" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">suspend 暫停，這就是 send 的行為</text>
  <text x="325" y="651" text-anchor="middle" font-size="10.5" fill="#374151">只有生產端協程暫停，並讓出底層執行緒</text>
  <text x="325" y="670" text-anchor="middle" font-size="10.5" fill="#374151">執行緒先去做其他事，空位出現後協程才恢復</text>

  <rect x="620" y="602" width="470" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="855" y="628" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">block 阻塞，不是 send 的行為</text>
  <text x="855" y="651" text-anchor="middle" font-size="10.5" fill="#374151">阻塞會讓整條執行緒原地卡住</text>
  <text x="855" y="670" text-anchor="middle" font-size="10.5" fill="#374151">同一條執行緒上的其他協程也無法前進</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
