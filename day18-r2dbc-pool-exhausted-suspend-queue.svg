  <text x="185" y="390" text-anchor="middle" font-size="20" font-weight="700" fill="#94a3b8">…</text>
  <text x="185" y="422" text-anchor="middle" font-size="12" fill="#334155">請求數量遠超過連線上限 50</text>
  <text x="185" y="444" text-anchor="middle" font-size="12" fill="#334155">每個請求由一個協程處理</text>

  <!-- 左 -> 中 -->
  <line x1="332" y1="290" x2="426" y2="290" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow-gray)"/>
  <text x="379" y="278" text-anchor="middle" font-size="11" fill="#6b7280">借用連線</text>

  <!-- ===== 中：連線池 ===== -->
  <rect x="430" y="100" width="360" height="380" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
  <text x="610" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#312e81">R2DBC ConnectionPool</text>
  <text x="610" y="152" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#334155">max-size: 50</text>
  <g fill="#6366f1" stroke="#312e81" stroke-width="1">
