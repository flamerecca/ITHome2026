  <text x="906" y="273" font-size="12" fill="#374151">等候中的協程 #53</text>
  <rect x="1088" y="258" width="80" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="1128" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">暫停中</text>
  <rect x="890" y="292" width="290" height="32" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="906" y="313" font-size="12" fill="#374151">等候中的協程 #54</text>
  <rect x="1088" y="298" width="80" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="1128" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">暫停中</text>
  <text x="1035" y="356" text-anchor="middle" font-size="20" font-weight="700" fill="#d6a756">…</text>
  <rect x="890" y="380" width="290" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.4"/>
  <text x="1035" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">狀態是暫停，執行緒已釋放</text>
  <text x="1035" y="427" text-anchor="middle" font-size="11.5" fill="#166534">執行緒先去處理其他工作，</text>
  <text x="1035" y="446" text-anchor="middle" font-size="11.5" fill="#166534">但這個協程依然在排隊</text>

  <!-- ===== 排隊中協程的三種後續走向 ===== -->
  <text x="620" y="512" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">排隊中的協程，三種後續走向</text>

  <rect x="40" y="526" width="370" height="96" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/>
  <text x="225" y="552" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">有連線被歸還</text>
  <text x="225" y="576" text-anchor="middle" font-size="11.5" fill="#374151">佇列最前面的協程恢復執行，</text>
  <text x="225" y="596" text-anchor="middle" font-size="11.5" fill="#374151">取得連線繼續完成查詢</text>

  <rect x="435" y="526" width="370" height="96" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
  <text x="620" y="552" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">等候超過 max-acquire-time: 3s</text>
  <text x="620" y="576" text-anchor="middle" font-size="11.5" fill="#374151">直接以逾時失敗收場，快速回應</text>
  <text x="620" y="596" text-anchor="middle" font-size="11.5" fill="#374151">「暫時無法處理，請稍後再試」，呼應 Day 16</text>

  <rect x="830" y="526" width="370" height="96" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text x="1015" y="552" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">父範圍被取消</text>
  <text x="1015" y="576" text-anchor="middle" font-size="11.5" fill="#374151">例如使用者提早斷線，排隊中的協程</text>
  <text x="1015" y="596" text-anchor="middle" font-size="11.5" fill="#374151">一併取消，讓出排隊名額，呼應 Day 06</text>

  <!-- ===== 兩個層次分開看待 ===== -->
  <rect x="40" y="648" width="570" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="325" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">✓ 執行緒層面：等待連線是暫停而非阻塞</text>
  <text x="325" y="704" text-anchor="middle" font-size="11.5" fill="#374151">執行緒不會被卡住，Dispatcher 上的其他協程不受拖累</text>

  <rect x="630" y="648" width="570" height="88" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="915" y="678" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">✕ 資源層面：連線數量依然有上限</text>
  <text x="915" y="704" text-anchor="middle" font-size="11.5" fill="#374151">供需失衡照樣排隊，排隊時間拉長，回應延遲照樣上升</text>

  <text x="620" y="772" text-anchor="middle" font-size="12" fill="#4b5563">兩件事必須分開看待，不能因為前者成立，就誤以為後者也一併消失</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
