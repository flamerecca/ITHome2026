  <rect x="520" y="322" width="180" height="28" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="610" y="341" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">50 / 50 全數借出中</text>
  <line x1="460" y1="368" x2="760" y2="368" stroke="#c7d2fe" stroke-width="1.2"/>
  <text x="610" y="392" text-anchor="middle" font-size="12" fill="#312e81">連線上限來自資料庫伺服器本身</text>
  <text x="610" y="414" text-anchor="middle" font-size="11.5" fill="#4338ca">記憶體、檔案描述符、連線處理程序</text>
  <text x="610" y="436" text-anchor="middle" font-size="11.5" fill="#4338ca">應用程式端改用非阻塞存取，</text>
  <text x="610" y="456" text-anchor="middle" font-size="11.5" fill="#4338ca">這個上限也不會自動消失</text>

  <!-- 中 -> 右 -->
  <line x1="792" y1="290" x2="866" y2="290" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="829" y="278" text-anchor="middle" font-size="11" fill="#92400e">已滿，排隊</text>

  <!-- ===== 右：等候佇列 ===== -->
  <rect x="870" y="100" width="330" height="380" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="1035" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">等候取得連線的協程</text>
  <text x="1035" y="152" text-anchor="middle" font-size="11" fill="#6b7280">等待有連線被釋放，才輪得到自己</text>
  <rect x="890" y="172" width="290" height="32" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="906" y="193" font-size="12" fill="#374151">等候中的協程 #51</text>
  <rect x="1088" y="178" width="80" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
  <text x="1128" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">暫停中</text>
  <rect x="890" y="212" width="290" height="32" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="906" y="233" font-size="12" fill="#374151">等候中的協程 #52</text>
  <rect x="1088" y="218" width="80" height="20" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.1"/>
