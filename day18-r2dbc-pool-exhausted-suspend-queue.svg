  <rect x="0" y="0" width="1240" height="810" fill="#ffffff"/>

  <text x="620" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">連線池被打滿時，超出的請求協程暫停排隊</text>
  <text x="620" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">訂單查詢與扣庫存服務，R2DBC 連線池 max-size 為 50，同時湧入的查詢請求遠超過 50</text>

