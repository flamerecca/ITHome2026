<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="720" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">報表 Resource 列表頁，圖表與表格區塊配置</text>

  <!-- 整體畫面外框 -->
  <rect x="60" y="70" width="920" height="610" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 第一區塊：折線圖 SalesReportTrendChart -->
  <rect x="80" y="90" width="880" height="200" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="112" font-size="13" font-weight="700" fill="#1e3a8a">SalesReportTrendChart　銷售趨勢</text>

  <!-- 折線圖示意 -->
  <polyline points="120,228 220,206 320,220 420,180 520,196 620,158 720,174 820,142"
            fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="120" cy="228" r="3.5" fill="#3b82f6"/>
  <circle cx="220" cy="206" r="3.5" fill="#3b82f6"/>
  <circle cx="320" cy="220" r="3.5" fill="#3b82f6"/>
  <circle cx="420" cy="180" r="3.5" fill="#3b82f6"/>
  <circle cx="520" cy="196" r="3.5" fill="#3b82f6"/>
  <circle cx="620" cy="158" r="3.5" fill="#3b82f6"/>
  <circle cx="720" cy="174" r="3.5" fill="#3b82f6"/>
  <circle cx="820" cy="142" r="3.5" fill="#3b82f6"/>
  <line x1="100" y1="248" x2="850" y2="248" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="272" font-size="11" fill="#1e3a8a">橫軸，近 30 天日期</text>
  <text x="740" y="272" font-size="11" fill="#1e3a8a">縱軸，每日訂單金額</text>

  <!-- 第二區塊：長條圖 SalesReportByCategoryChart -->
  <rect x="80" y="306" width="880" height="200" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="100" y="328" font-size="13" font-weight="700" fill="#14532d">SalesReportByCategoryChart　商品分類銷售量</text>
  <text x="700" y="328" font-size="11" fill="#14532d">縱軸，累計銷售數量</text>

  <!-- 長條圖示意，三個分類 -->
  <rect x="180" y="398" width="70" height="72" fill="#22c55e"/>
  <text x="215" y="490" text-anchor="middle" font-size="11.5" fill="#14532d">寵物飼料</text>

  <rect x="380" y="358" width="70" height="112" fill="#22c55e"/>
  <text x="415" y="490" text-anchor="middle" font-size="11.5" fill="#14532d">寵物玩具</text>

  <rect x="580" y="428" width="70" height="42" fill="#22c55e"/>
  <text x="615" y="490" text-anchor="middle" font-size="11.5" fill="#14532d">清潔用品</text>

  <line x1="140" y1="470" x2="780" y2="470" stroke="#86efac" stroke-width="1"/>

  <!-- 第三區塊：接續 Day 26 表格 -->
  <rect x="80" y="522" width="880" height="140" rx="8" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="100" y="546" font-size="13" font-weight="700" fill="#374151">Day 26 表格區塊　SalesReport 彙整結果</text>

  <rect x="100" y="558" width="840" height="30" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="120" y="578" font-size="12" font-weight="600" fill="#374151">商品名稱</text>
  <text x="500" y="578" font-size="12" font-weight="600" fill="#374151">累計銷售數量</text>

  <rect x="100" y="588" width="840" height="30" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="120" y="608" font-size="11.5" fill="#6b7280">寵物潔牙骨 S 號</text>
  <text x="500" y="608" font-size="11.5" fill="#6b7280">128</text>

  <rect x="100" y="618" width="840" height="30" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="120" y="638" font-size="11.5" fill="#6b7280">貓籠 加大款</text>
  <text x="500" y="638" font-size="11.5" fill="#6b7280">64</text>

  <!-- 底部說明 -->
  <text x="520" y="700" text-anchor="middle" font-size="13" fill="#6b7280">頂部依序為折線圖、長條圖，下方接續 Day 26 已建立的表格區塊</text>
</svg>
