<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">跑完一整條生產線：五天份 Git 入門示意系列從規格到發佈</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">五份規格書依序展開，審查在第 5 天抓出跨篇不一致並局部打回，修正後五天內容收斂、轉換、確認後發佈</text>
  <text x="60" y="140" text-anchor="start" font-size="13" fill="#1f2937" font-weight="700">規劃代理人</text>
  <text x="60" y="160" text-anchor="start" font-size="11" fill="#6b7280">產出 Section Spec</text>
  <text x="60" y="240" text-anchor="start" font-size="13" fill="#1f2937" font-weight="700">寫作 ＋ 視覺</text>
  <text x="60" y="260" text-anchor="start" font-size="11" fill="#6b7280">協同產出初稿與素材</text>
  <text x="60" y="340" text-anchor="start" font-size="13" fill="#1f2937" font-weight="700">審查代理人</text>
  <text x="60" y="360" text-anchor="start" font-size="11" fill="#6b7280">查核</text>
  <text x="60" y="440" text-anchor="start" font-size="13" fill="#1f2937" font-weight="700">統一格式成品</text>
  <text x="60" y="460" text-anchor="start" font-size="11" fill="#6b7280">轉換、HITL、發佈</text>
  <text x="330" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">第 1 天</text>
  <rect x="250" y="120" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="250" y="220" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="250" y="320" width="160" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="250" y="420" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="330" y="145" text-anchor="middle" font-size="11" fill="#312e81">基本概念與安裝</text>
  <text x="330" y="163" text-anchor="middle" font-size="10.5" fill="#6b7280">Spec</text>
  <text x="330" y="245" text-anchor="middle" font-size="11" fill="#14532d">初稿 ＋ 視覺素材</text>
  <text x="330" y="345" text-anchor="middle" font-size="11" fill="#7c2d12">通過</text>
  <text x="330" y="445" text-anchor="middle" font-size="11" fill="#4b5563">收斂為統一格式</text>
  <line x1="330" y1="180" x2="330" y2="218" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="330" y1="280" x2="330" y2="318" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="330" y1="380" x2="330" y2="418" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="510" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">第 2 天</text>
  <rect x="430" y="120" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="430" y="220" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="430" y="320" width="160" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="430" y="420" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="510" y="145" text-anchor="middle" font-size="11" fill="#312e81">工作區、暫存區與 commit</text>
  <text x="510" y="163" text-anchor="middle" font-size="10.5" fill="#6b7280">Spec</text>
  <text x="510" y="245" text-anchor="middle" font-size="11" fill="#14532d">初稿 ＋ 視覺素材</text>
  <text x="510" y="345" text-anchor="middle" font-size="11" fill="#7c2d12">通過</text>
  <text x="510" y="445" text-anchor="middle" font-size="11" fill="#4b5563">收斂為統一格式</text>
  <line x1="510" y1="180" x2="510" y2="218" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="510" y1="280" x2="510" y2="318" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="510" y1="380" x2="510" y2="418" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="690" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">第 3 天</text>
  <rect x="610" y="120" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="610" y="220" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="610" y="320" width="160" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="610" y="420" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="690" y="145" text-anchor="middle" font-size="11" fill="#312e81">commit 粒度與回溯</text>
  <text x="690" y="163" text-anchor="middle" font-size="10.5" fill="#6b7280">Spec</text>
  <text x="690" y="245" text-anchor="middle" font-size="11" fill="#14532d">初稿 ＋ 視覺素材</text>
  <text x="690" y="345" text-anchor="middle" font-size="11" fill="#7c2d12">通過</text>
  <text x="690" y="445" text-anchor="middle" font-size="11" fill="#4b5563">收斂為統一格式</text>
  <line x1="690" y1="180" x2="690" y2="218" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="690" y1="280" x2="690" y2="318" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="690" y1="380" x2="690" y2="418" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="870" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">第 4 天</text>
  <rect x="790" y="120" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="790" y="220" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="790" y="320" width="160" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="790" y="420" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="870" y="145" text-anchor="middle" font-size="11" fill="#312e81">分支操作與合併節奏</text>
  <text x="870" y="163" text-anchor="middle" font-size="10.5" fill="#6b7280">Spec</text>
  <text x="870" y="245" text-anchor="middle" font-size="11" fill="#14532d">初稿 ＋ 視覺素材</text>
  <text x="870" y="345" text-anchor="middle" font-size="11" fill="#7c2d12">通過</text>
  <text x="870" y="445" text-anchor="middle" font-size="11" fill="#4b5563">收斂為統一格式</text>
  <line x1="870" y1="180" x2="870" y2="218" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="870" y1="280" x2="870" y2="318" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="870" y1="380" x2="870" y2="418" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="1050" y="100" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">第 5 天</text>
  <rect x="970" y="120" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <rect x="970" y="220" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="970" y="320" width="160" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="970" y="420" width="160" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="1050" y="145" text-anchor="middle" font-size="11" fill="#312e81">常見錯誤排查</text>
  <text x="1050" y="163" text-anchor="middle" font-size="10.5" fill="#6b7280">Spec</text>
  <text x="1050" y="245" text-anchor="middle" font-size="11" fill="#14532d">初稿 ＋ 視覺素材</text>
  <text x="1050" y="345" text-anchor="middle" font-size="11" fill="#7c2d12"></text>
  <text x="1050" y="445" text-anchor="middle" font-size="11" fill="#4b5563">收斂為統一格式</text>
  <line x1="1050" y1="180" x2="1050" y2="218" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="1050" y1="280" x2="1050" y2="318" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="1050" y1="380" x2="1050" y2="418" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="690" y="263" text-anchor="middle" font-size="10" fill="#6b7280">沿用第 1 天的粒度前提</text>
  <text x="870" y="263" text-anchor="middle" font-size="10" fill="#6b7280">協同產出流程圖，無等待</text>
  <text x="1050" y="263" text-anchor="middle" font-size="10" fill="#6b7280">論證步驟拆解逐一排查</text>
  <rect x="970" y="320" width="160" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="1050" y="342" text-anchor="middle" font-size="11.5" fill="#7f1d1d" font-weight="700">查出跨篇不一致</text>
  <text x="1050" y="360" text-anchor="middle" font-size="10.5" fill="#4b5563">和錨點登記的第 2 天標準不符</text>
  <circle cx="1130" cy="320" r="12" fill="#dc2626"/>
  <text x="1130" y="325" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700">!</text>
  <path d="M 1130 350 C 1180 330, 1180 260, 1132 252" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-red)"/>
  <text x="1150" y="300" text-anchor="start" font-size="11" fill="#7f1d1d" font-weight="700">打回</text>
  <text x="1150" y="316" text-anchor="start" font-size="11" fill="#7f1d1d" font-weight="700">寫作</text>
  <rect x="60" y="508" width="1080" height="92" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="80" y="534" text-anchor="start" font-size="13" fill="#7f1d1d" font-weight="700">打回機制實際觸發的位置：第 5 天的審查</text>
  <text x="80" y="558" text-anchor="start" font-size="11.5" fill="#4b5563">內容層面的問題，依 Day 03 交接方向打回寫作代理人；依 Day 31 局部保留原則，只修正第 5 天那一小段引用，</text>
  <text x="80" y="578" text-anchor="start" font-size="11.5" fill="#4b5563">其餘段落與另外四天都不受影響；修正後重新標記完成，審查代理人針對這一段複核，確認一致才放行</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
