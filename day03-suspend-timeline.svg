<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="540" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">findOrderById 執行過程的三個時間點</text>
  <text x="540" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">handleOrderQuery 呼叫 findOrderById，對照函式呼叫進入、暫停、恢復發生於哪一刻</text>

  <!-- 主時間軸 -->
  <line x1="120" y1="160" x2="960" y2="160" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="965" y="165" font-size="13" fill="#6b7280">時間</text>

  <!-- 時間點座標 -->
  <!-- 時間點 1：x=220，時間點 2：x=540，時間點 3：x=860 -->

  <!-- ===== 時間點 1：函式呼叫進入 ===== -->
  <circle cx="220" cy="160" r="9" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <text x="220" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">時間點 1</text>

  <line x1="220" y1="169" x2="220" y2="206" stroke="#93c5fd" stroke-width="2"/>
  <rect x="90" y="206" width="260" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">函式呼叫進入</text>
  <text x="220" y="256" text-anchor="middle" font-size="12.5" fill="#374151">handleOrderQuery 呼叫</text>
  <text x="220" y="274" text-anchor="middle" font-size="12.5" fill="#374151">findOrderById 的瞬間</text>
  <text x="220" y="293" text-anchor="middle" font-size="11.5" fill="#6b7280">跟一般函式呼叫沒有兩樣</text>

  <!-- 程式碼標註 1 -->
  <line x1="220" y1="302" x2="220" y2="336" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="70" y="336" width="300" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="358" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#334155">findOrderById(orderId)</text>

  <!-- ===== 時間點 2：暫停發生 ===== -->
  <circle cx="540" cy="160" r="10" fill="#f59e0b" stroke="#78350f" stroke-width="2.5"/>
  <text x="540" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">時間點 2</text>
  <text x="540" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">暫停發生於此</text>

  <line x1="540" y1="170" x2="540" y2="206" stroke="#fcd34d" stroke-width="2"/>
  <rect x="405" y="206" width="270" height="112" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="540" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">暫停</text>
  <text x="540" y="254" text-anchor="middle" font-size="12.5" fill="#374151">orderRepository</text>
  <text x="540" y="272" text-anchor="middle" font-size="12.5" fill="#374151">.findByIdOrNull(orderId)</text>
  <text x="540" y="292" text-anchor="middle" font-size="11.5" fill="#6b7280">資料庫還沒把結果送回來之前</text>
  <text x="540" y="308" text-anchor="middle" font-size="11.5" fill="#6b7280">函式必須停在這裡</text>

  <!-- 程式碼標註 2 -->
  <line x1="540" y1="318" x2="540" y2="352" stroke="#fde68a" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="385" y="352" width="310" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="540" y="374" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">val order = orderRepository.findByIdOrNull(orderId)</text>

  <!-- 等待資料庫區間標示 -->
  <line x1="540" y1="160" x2="540" y2="160" stroke="none"/>
  <path d="M 540 90 L 860 90" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="540" y1="84" x2="540" y2="96" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="860" y1="84" x2="860" y2="96" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="80" text-anchor="middle" font-size="12" fill="#b45309">等待資料庫回應期間，執行緒被釋放，不在原地乾等</text>

  <!-- ===== 時間點 3：恢復發生 ===== -->
  <circle cx="860" cy="160" r="10" fill="#22c55e" stroke="#14532d" stroke-width="2.5"/>
  <text x="860" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">時間點 3</text>
  <text x="860" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a">恢復發生於此</text>

  <line x1="860" y1="170" x2="860" y2="206" stroke="#86efac" stroke-width="2"/>
  <rect x="725" y="206" width="270" height="112" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="860" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">恢復</text>
  <text x="860" y="254" text-anchor="middle" font-size="12.5" fill="#374151">資料庫把結果送回來之後</text>
  <text x="860" y="274" text-anchor="middle" font-size="12.5" fill="#374151">程式繼續往下執行</text>
  <text x="860" y="294" text-anchor="middle" font-size="11.5" fill="#6b7280">到 println("查詢完成...")</text>
  <text x="860" y="310" text-anchor="middle" font-size="11.5" fill="#6b7280">這一行</text>

  <!-- 程式碼標註 3 -->
  <line x1="860" y1="318" x2="860" y2="352" stroke="#bbf7d0" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="700" y="352" width="320" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="860" y="374" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">println("查詢完成，訂單 $orderId 的查詢結果已經拿到")</text>

  <!-- 底部圖例與說明 -->
  <line x1="80" y1="430" x2="1000" y2="430" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="110" cy="464" r="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="128" y="469" font-size="13" fill="#374151">函式呼叫進入，跟一般函式呼叫相同</text>

  <circle cx="110" cy="494" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
  <text x="128" y="499" font-size="13" fill="#374151">暫停，函式停在等待資料庫回應的那一行</text>

  <circle cx="110" cy="524" r="7" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
  <text x="128" y="529" font-size="13" fill="#374151">恢復，結果送回後接續往下執行</text>

  <text x="540" y="570" text-anchor="middle" font-size="13" fill="#6b7280">來源：findOrderById／handleOrderQuery 範例，暫停發生於時間點 2，恢復發生於時間點 3</text>
  <text x="540" y="592" text-anchor="middle" font-size="13" fill="#6b7280">今天要看懂的，就只有時間點 2 與時間點 3 這兩個時間點</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
