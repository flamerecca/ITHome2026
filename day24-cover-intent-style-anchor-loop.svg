<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">封面與插圖：兩層原則依序運作，風格錨點跨天回頭查閱</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">先依標題與核心目標決定意象，再查閱全域錨點檔案沿用風格，第一次確立的風格成為後續每一天的依據</text>
  <rect x="40" y="100" width="250" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="165" y="126" text-anchor="middle" font-size="13" fill="#1f2937" font-weight="700">輸入：既有欄位</text>
  <rect x="58" y="142" width="214" height="34" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="165" y="164" text-anchor="middle" font-size="12" fill="#334155">文章標題</text>
  <rect x="58" y="186" width="214" height="34" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="165" y="208" text-anchor="middle" font-size="11.5" fill="#334155">Section Spec 的核心目標欄位</text>
  <text x="165" y="240" text-anchor="middle" font-size="10.5" fill="#6b7280">Day 04 定案的既有交接介面</text>
  <rect x="40" y="272" width="250" height="66" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="165" y="298" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="700">✕ 圖表佔位符用不上</text>
  <text x="165" y="318" text-anchor="middle" font-size="10.5" fill="#6b7280">封面沒有既有段落內容可以指向</text>
  <line x1="290" y1="175" x2="328" y2="175" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="330" y="100" width="260" height="150" rx="12" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="330" y="100" width="260" height="34" rx="12" fill="#4338ca"/>
  <rect x="330" y="120" width="260" height="14" fill="#4338ca"/>
  <text x="460.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">第一層：決定意象方向</text>
  <text x="346" y="158" text-anchor="start" font-size="12" fill="#312e81">依標題與核心目標判斷，</text>
  <text x="346" y="178" text-anchor="start" font-size="12" fill="#312e81">這一篇整體給人的印象</text>
  <text x="346" y="198" text-anchor="start" font-size="12" fill="#312e81">該用什麼畫面表達</text>
  <line x1="590" y1="175" x2="628" y2="175" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="630" y="100" width="260" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="630" y="100" width="260" height="34" rx="12" fill="#d97706"/>
  <rect x="630" y="120" width="260" height="14" fill="#d97706"/>
  <text x="760.0" y="122" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">第二層：查閱風格設定</text>
  <text x="646" y="158" text-anchor="start" font-size="12" fill="#78350f">回頭查閱全域錨點檔案，</text>
  <text x="646" y="178" text-anchor="start" font-size="12" fill="#78350f">沿用已記錄的色調、</text>
  <text x="646" y="198" text-anchor="start" font-size="12" fill="#78350f">構圖傾向、畫風調性</text>
  <line x1="890" y1="175" x2="928" y2="175" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="930" y="100" width="230" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1045" y="150" text-anchor="middle" font-size="14" fill="#14532d" font-weight="700">產出封面或插圖</text>
  <text x="1045" y="176" text-anchor="middle" font-size="12" fill="#4b5563">意象貼合這一篇，</text>
  <text x="1045" y="196" text-anchor="middle" font-size="12" fill="#4b5563">風格與系列一致</text>
  <rect x="560" y="360" width="400" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.2"/>
  <text x="760" y="390" text-anchor="middle" font-size="14" fill="#78350f" font-weight="700">全域錨點檔案</text>
  <text x="760" y="414" text-anchor="middle" font-size="11.5" fill="#92400e">Day 05 定案的系列單一事實來源，</text>
  <text x="760" y="434" text-anchor="middle" font-size="11.5" fill="#92400e">名詞、架構決策之外，多記一筆視覺風格錨點</text>
  <path d="M 760 250 L 760 356" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ar-amber)"/>
  <text x="772" y="300" text-anchor="start" font-size="11" fill="#92400e">每一天產出前</text>
  <text x="772" y="316" text-anchor="start" font-size="11" fill="#92400e">都要回頭查閱</text>
  <text x="40" y="386" text-anchor="start" font-size="12.5" fill="#1f2937" font-weight="700">系列時間軸</text>
  <rect x="40" y="400" width="220" height="70" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="150" y="426" text-anchor="middle" font-size="12.5" fill="#831843" font-weight="700">系列第一次產出封面</text>
  <text x="150" y="448" text-anchor="middle" font-size="11.5" fill="#4b5563">風格在這一次確立</text>
  <path d="M 260 435 C 380 435, 440 410, 556 410" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#db2777" font-weight="700">記錄進去</text>
  <rect x="40" y="500" width="220" height="70" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="150" y="526" text-anchor="middle" font-size="12.5" fill="#312e81" font-weight="700">後續每一天</text>
  <text x="150" y="548" text-anchor="middle" font-size="11.5" fill="#4b5563">例如 Day 24、Day 35</text>
  <path d="M 556 440 C 440 470, 380 535, 264 535" fill="none" stroke="#4338ca" stroke-width="2" marker-end="url(#ar-indigo)"/>
  <text x="400" y="520" text-anchor="middle" font-size="11" fill="#4338ca" font-weight="700">查閱沿用</text>
  <text x="600" y="606" text-anchor="middle" font-size="12" fill="#6b7280">兩層原則只定案到工作模式層級，不指定生成式圖像技術或工具；風格錨點沿用既有檔案，不另立新檔</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
