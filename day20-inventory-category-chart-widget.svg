<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="560" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">後台首頁，InventoryByCategoryChart 掛載後畫面</text>

  <!-- 整體畫面外框 -->
  <rect x="60" y="70" width="920" height="450" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- 上方沿用 OrderTrendChart 折線圖區塊，示意此圖出現在其後 -->
  <rect x="80" y="90" width="880" height="90" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="100" y="114" font-size="12.5" font-weight="700" fill="#1e3a8a">OrderTrendChart　近七天訂單趨勢，折線圖區塊</text>
  <polyline points="120,160 300,150 480,165 660,145 840,155"
            fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- 下方圖表區塊：長條圖 InventoryByCategoryChart -->
  <rect x="80" y="200" width="880" height="300" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="100" y="228" font-size="14" font-weight="700" fill="#14532d">各分類庫存量</text>

  <!-- 長條圖示意，四個商品分類，其中一個明顯偏矮 -->
  <rect x="150" y="330" width="80" height="130" fill="#22c55e"/>
  <text x="190" y="480" text-anchor="middle" font-size="12" fill="#14532d">飼料</text>

  <rect x="330" y="380" width="80" height="80" fill="#22c55e"/>
  <text x="370" y="480" text-anchor="middle" font-size="12" fill="#14532d">玩具</text>

  <rect x="510" y="440" width="80" height="20" fill="#22c55e"/>
  <text x="550" y="480" text-anchor="middle" font-size="12" fill="#14532d">清潔用品</text>

  <rect x="690" y="300" width="80" height="160" fill="#22c55e"/>
  <text x="730" y="480" text-anchor="middle" font-size="12" fill="#14532d">牽繩配件</text>

  <line x1="130" y1="460" x2="800" y2="460" stroke="#86efac" stroke-width="1"/>
  <text x="700" y="248" font-size="11.5" fill="#14532d">縱軸，各分類庫存總量</text>
  <text x="130" y="272" font-size="11.5" fill="#14532d">橫軸，商品分類</text>

  <!-- 底部說明 -->
  <text x="520" y="530" text-anchor="middle" font-size="13" fill="#6b7280">上方沿用折線圖區塊，下方新增長條圖，清潔用品分類明顯偏矮，提示需盡快進貨</text>
</svg>
