<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Semaphore 等候時間的分位數趨勢，持續墊高就是警訊</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">Timer 指標 stock_check.semaphore.wait 隨時間變化，看的是走勢，不是單一時間點的數字</text>
  <line x1="110" y1="520.0" x2="990" y2="520.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="524.0" text-anchor="end" font-size="11" fill="#6b7280">0 ms</text>
  <line x1="110" y1="420.0" x2="990" y2="420.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="424.0" text-anchor="end" font-size="11" fill="#6b7280">100 ms</text>
  <line x1="110" y1="320.0" x2="990" y2="320.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="324.0" text-anchor="end" font-size="11" fill="#6b7280">200 ms</text>
  <line x1="110" y1="220.0" x2="990" y2="220.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="224.0" text-anchor="end" font-size="11" fill="#6b7280">300 ms</text>
  <line x1="110" y1="120.0" x2="990" y2="120.0" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="124.0" text-anchor="end" font-size="11" fill="#6b7280">400 ms</text>
  <line x1="110" y1="520" x2="990" y2="520" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="110.0" y1="520" x2="110.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="110.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">0 分</text>
  <line x1="256.66666666666663" y1="520" x2="256.66666666666663" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="256.66666666666663" y="540" text-anchor="middle" font-size="11" fill="#6b7280">10 分</text>
  <line x1="403.3333333333333" y1="520" x2="403.3333333333333" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="403.3333333333333" y="540" text-anchor="middle" font-size="11" fill="#6b7280">20 分</text>
  <line x1="550.0" y1="520" x2="550.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="550.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">30 分</text>
  <line x1="696.6666666666666" y1="520" x2="696.6666666666666" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="696.6666666666666" y="540" text-anchor="middle" font-size="11" fill="#6b7280">40 分</text>
  <line x1="843.3333333333334" y1="520" x2="843.3333333333334" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="843.3333333333334" y="540" text-anchor="middle" font-size="11" fill="#6b7280">50 分</text>
  <line x1="990.0" y1="520" x2="990.0" y2="525" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="990.0" y="540" text-anchor="middle" font-size="11" fill="#6b7280">60 分</text>
  <text x="110" y="106" text-anchor="start" font-size="11.5" fill="#4b5563" font-weight="700">stock_check.semaphore.wait，示意</text>
  <text x="550.0" y="562" text-anchor="middle" font-size="11.5" fill="#4b5563" font-weight="700">監控時間</text>
  <rect x="623.3333333333334" y="120" width="366.66666666666663" height="400" fill="#fef2f2"/>
  <path d="M 110.0 505.0 L 183.3 502.0 L 256.7 496.0 L 330.0 488.0 L 403.3 475.0 L 476.7 458.0 L 550.0 435.0 L 623.3 405.0 L 696.7 370.0 L 770.0 325.0 L 843.3 275.0 L 916.7 220.0 L 990.0 160.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 110.0 512.0 L 183.3 511.0 L 256.7 508.0 L 330.0 505.0 L 403.3 500.0 L 476.7 492.0 L 550.0 480.0 L 623.3 465.0 L 696.7 445.0 L 770.0 420.0 L 843.3 390.0 L 916.7 355.0 L 990.0 315.0" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 110.0 518.0 L 183.3 518.0 L 256.7 517.0 L 330.0 517.0 L 403.3 516.0 L 476.7 515.0 L 550.0 514.0 L 623.3 512.0 L 696.7 510.0 L 770.0 507.0 L 843.3 504.0 L 916.7 500.0 L 990.0 496.0" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="1002.0" y="164.0" text-anchor="start" font-size="12" fill="#1f2937" font-weight="700">p99</text>
  <text x="1002.0" y="319.0" text-anchor="start" font-size="12" fill="#1f2937" font-weight="700">p95</text>
  <text x="1002.0" y="500.0" text-anchor="start" font-size="12" fill="#1f2937" font-weight="700">p50</text>
  <line x1="140" y1="146" x2="162" y2="146" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="150" text-anchor="start" font-size="12" fill="#4b5563">p99</text>
  <line x1="140" y1="168" x2="162" y2="168" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="172" text-anchor="start" font-size="12" fill="#4b5563">p95</text>
  <line x1="140" y1="190" x2="162" y2="190" stroke="#1baf7a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="194" text-anchor="start" font-size="12" fill="#4b5563">p50</text>
  <rect x="638.0" y="125.0" width="300" height="62" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="788.0" y="149.0" text-anchor="middle" font-size="12.5" fill="#b91c1c" font-weight="700">曲線持續墊高，沒有回落</text>
  <text x="788.0" y="169.0" text-anchor="middle" font-size="11.5" fill="#4b5563">permits = 20 這個設定值可能已經不敷使用</text>
  <text x="600" y="600" text-anchor="middle" font-size="12" fill="#6b7280">示意走勢：計時涵蓋排隊等候與真正執行呼叫兩段時間的總和，並非實測結果</text>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
