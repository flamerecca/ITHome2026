<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="550" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="580" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">同一張訂單從建立到確認的路徑示意圖</text>
  <text x="580" y="64" text-anchor="middle" font-size="13" fill="#6b7280">依序對應建立表單選客戶、新增明細、列表確認、套用篩選四個畫面</text>

  <!-- 案例主軸標註 -->
  <rect x="380" y="82" width="400" height="30" rx="15" fill="#111827"/>
  <text x="580" y="102" text-anchor="middle" font-size="12.5" fill="#ffffff">案例：旺旺寵物用品行叫貨　飼料 10 件、玩具 5 件</text>

  <!-- 四個階段容器，統一寬 252，統一 y 起點 126，統一高度 360 -->

  <!-- 階段一：訂單建立表單 -->
  <rect x="30" y="126" width="252" height="360" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="30" y="126" width="252" height="40" rx="12" fill="#2563eb"/>
  <rect x="30" y="146" width="252" height="20" fill="#2563eb"/>
  <text x="156" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">① 訂單建立表單</text>

  <text x="50" y="188" font-size="12.5" fill="#1e3a8a">業務人員登入，建立</text>
  <text x="50" y="206" font-size="12.5" fill="#1e3a8a">新訂單並選擇客戶</text>

  <rect x="50" y="226" width="212" height="50" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="66" y="246" font-size="12.5" fill="#1e40af">填寫訂單編號</text>
  <text x="66" y="264" font-size="12.5" fill="#1e40af">訂單日期、狀態</text>

  <rect x="50" y="286" width="212" height="50" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="66" y="306" font-size="12.5" fill="#1e40af">所屬客戶欄位</text>
  <text x="66" y="324" font-size="12.5" fill="#1e40af">下拉搜尋選擇</text>

  <rect x="50" y="346" width="212" height="50" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="66" y="366" font-size="12.5" fill="#1e3a8a">選中</text>
  <text x="66" y="384" font-size="13.5" font-weight="700" fill="#1e3a8a">旺旺寵物用品行</text>

  <rect x="50" y="442" width="212" height="34" rx="17" fill="#dbeafe"/>
  <text x="156" y="463" text-anchor="middle" font-size="11.5" fill="#1e3a8a">customer_id 已存入資料庫</text>

  <!-- 階段二：訂單編輯頁 Relation Manager -->
  <rect x="308" y="126" width="252" height="360" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="308" y="126" width="252" height="40" rx="12" fill="#16a34a"/>
  <rect x="308" y="146" width="252" height="20" fill="#16a34a"/>
  <text x="434" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">② Relation Manager 明細</text>

  <text x="328" y="188" font-size="12.5" fill="#14532d">點擊新增按鈕，</text>
  <text x="328" y="206" font-size="12.5" fill="#14532d">依序輸入商品與數量</text>

  <rect x="328" y="226" width="212" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="344" y="245" font-size="11.5" fill="#374151">新增明細一</text>
  <text x="344" y="262" font-size="13" fill="#166534">商品：飼料</text>
  <text x="344" y="279" font-size="13" font-family="Menlo, Consolas, monospace" fill="#166534">數量：10</text>

  <rect x="328" y="300" width="212" height="60" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="344" y="319" font-size="11.5" fill="#374151">新增明細二</text>
  <text x="344" y="336" font-size="13" fill="#166534">商品：玩具</text>
  <text x="344" y="353" font-size="13" font-family="Menlo, Consolas, monospace" fill="#166534">數量：5</text>

  <rect x="328" y="442" width="212" height="34" rx="17" fill="#dcfce7"/>
  <text x="434" y="463" text-anchor="middle" font-size="11.5" fill="#14532d">兩筆明細互不干擾</text>

  <!-- 階段三：訂單列表頁 -->
  <rect x="586" y="126" width="252" height="360" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="586" y="126" width="252" height="40" rx="12" fill="#d97706"/>
  <rect x="586" y="146" width="252" height="20" fill="#d97706"/>
  <text x="712" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">③ 訂單列表頁</text>

  <text x="606" y="188" font-size="12.5" fill="#78350f">儲存後回到列表頁，</text>
  <text x="606" y="206" font-size="12.5" fill="#78350f">確認客戶名稱顯示</text>

  <rect x="606" y="226" width="212" height="66" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  <text x="622" y="246" font-size="11.5" fill="#374151">客戶欄位顯示</text>
  <text x="622" y="266" font-size="14" font-weight="700" fill="#92400e">旺旺寵物用品行</text>
  <text x="622" y="283" font-size="11.5" fill="#92400e">不是裸主鍵數字</text>

  <rect x="606" y="442" width="212" height="34" rx="17" fill="#fde68a"/>
  <text x="712" y="463" text-anchor="middle" font-size="11.5" fill="#78350f">customer.name 一眼可讀</text>

  <!-- 階段四：依客戶篩選 -->
  <rect x="864" y="126" width="252" height="360" rx="12" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <rect x="864" y="126" width="252" height="40" rx="12" fill="#db2777"/>
  <rect x="864" y="146" width="252" height="20" fill="#db2777"/>
  <text x="990" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">④ 依客戶篩選</text>

  <text x="884" y="188" font-size="12.5" fill="#831843">點開篩選下拉選單，</text>
  <text x="884" y="206" font-size="12.5" fill="#831843">選擇特定客戶</text>

  <rect x="884" y="226" width="212" height="50" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.2"/>
  <text x="900" y="246" font-size="11.5" fill="#374151">套用篩選</text>
  <text x="900" y="264" font-size="13" font-weight="700" fill="#be185d">旺旺寵物用品行</text>

  <rect x="884" y="290" width="212" height="50" rx="8" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.2"/>
  <text x="900" y="310" font-size="11.5" fill="#374151">篩選結果</text>
  <text x="900" y="328" font-size="13" fill="#be185d">僅留該店全部訂單</text>

  <rect x="884" y="442" width="212" height="34" rx="17" fill="#fbcfe8"/>
  <text x="990" y="463" text-anchor="middle" font-size="11.5" fill="#831843">篩選結果符合預期</text>

  <!-- 階段間箭頭，統一置於 y=414，位於所有內容方塊之下、狀態徽章之上 -->
  <line x1="282" y1="414" x2="308" y2="414" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <line x1="560" y1="414" x2="586" y2="414" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <line x1="838" y1="414" x2="864" y2="414" stroke="#6b7280" stroke-width="2.5" marker-end="url(#arrow-gray)"/>

  <!-- 底部說明 -->
  <text x="580" y="512" text-anchor="middle" font-size="12" fill="#6b7280">四個畫面依序串接：儲存訂單進入編輯頁、儲存明細回到列表頁、套用篩選</text>
  <text x="580" y="532" text-anchor="middle" font-size="12" fill="#6b7280">同一張訂單全程沒有露出裸主鍵，也沒有任何一步卡住</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
