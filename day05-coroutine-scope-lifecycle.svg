<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1080" height="700" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="540" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">一次請求對應一個 Coroutine Scope</text>
  <text x="540" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">請求進入建立 Scope，兩個協程掛在同一個 Scope 底下並行，請求結束 Scope 收合，協程一併結束</text>

  <!-- 主時間軸 -->
  <line x1="100" y1="150" x2="980" y2="150" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="985" y="155" font-size="13" fill="#6b7280">時間</text>

  <!-- 時間點座標：進入 x=190，收合 x=890 -->

  <!-- ===== 時間點 1：HTTP 請求進入 ===== -->
  <circle cx="190" cy="150" r="9" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <text x="190" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">請求進入</text>

  <line x1="190" y1="159" x2="190" y2="192" stroke="#93c5fd" stroke-width="2"/>
  <rect x="70" y="192" width="240" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">HTTP 請求進入</text>
  <text x="190" y="238" text-anchor="middle" font-size="12" fill="#374151">Controller 接收到</text>
  <text x="190" y="256" text-anchor="middle" font-size="12" fill="#374151">這次請求</text>

  <!-- 進入→建立 Scope 箭頭 -->
  <line x1="310" y1="234" x2="368" y2="234" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="339" y="222" text-anchor="middle" font-size="11" fill="#6b7280">對應建立</text>

  <!-- Coroutine Scope 容器：貫穿中段，涵蓋兩個協程 -->
  <rect x="376" y="192" width="440" height="380" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="596" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Coroutine Scope</text>
  <text x="596" y="240" text-anchor="middle" font-size="11.5" fill="#7c3aed">這次請求的協程之家</text>

  <!-- 協程 1：查詢訂單 -->
  <rect x="404" y="264" width="180" height="108" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="494" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">協程：查詢訂單</text>
  <text x="494" y="312" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">scope.launch {</text>
  <text x="494" y="330" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">findOrderById()</text>
  <text x="494" y="348" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">}</text>
  <text x="494" y="365" text-anchor="middle" font-size="10.5" fill="#6b7280">與確認庫存並行</text>

  <!-- 協程 2：確認庫存 -->
  <rect x="608" y="264" width="180" height="108" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="698" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">協程：確認庫存</text>
  <text x="698" y="312" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">scope.launch {</text>
  <text x="698" y="330" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">checkStock</text>
  <text x="698" y="348" text-anchor="middle" font-size="11.5" font-family="Menlo, Consolas, monospace" fill="#334155">Availability()</text>
  <text x="698" y="365" text-anchor="middle" font-size="10.5" fill="#6b7280">與查詢訂單並行</text>

  <!-- 兩協程同時掛在 Scope 下的說明 -->
  <text x="596" y="410" text-anchor="middle" font-size="11.5" fill="#7c3aed">兩個協程同時掛在同一個 Scope 底下，互不排隊</text>

  <!-- Scope 內部收合示意：底部橫線把兩協程收攏，與上方文字、下方文字都留出安全間距 -->
  <path d="M 494 372 L 494 452 L 698 452 L 698 372" stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <text x="596" y="500" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5b21b6">Scope 收合時，兩者一併結束</text>

  <!-- 建立→收合 箭頭 -->
  <line x1="824" y1="234" x2="878" y2="234" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="851" y="222" text-anchor="middle" font-size="11" fill="#6b7280">結束時</text>

  <!-- ===== 時間點 2：請求結束、Scope 收合 ===== -->
  <circle cx="890" cy="150" r="10" fill="#ef4444" stroke="#7f1d1d" stroke-width="2.5"/>
  <text x="890" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">請求結束</text>

  <line x1="890" y1="160" x2="890" y2="192" stroke="#fca5a5" stroke-width="2"/>
  <rect x="800" y="192" width="180" height="120" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="890" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Scope 收合</text>
  <text x="890" y="238" text-anchor="middle" font-size="11.5" fill="#374151">請求結束或逾時</text>
  <text x="890" y="256" text-anchor="middle" font-size="11.5" fill="#374151">Scope 跟著收掉</text>
  <text x="890" y="280" text-anchor="middle" font-size="11" fill="#6b7280">查詢訂單、確認庫存</text>
  <text x="890" y="297" text-anchor="middle" font-size="11" fill="#6b7280">兩個協程一併結束</text>

  <!-- 底部圖例：往下挪，避開加高後的 Scope 框（下緣 y=572） -->
  <line x1="70" y1="612" x2="1010" y2="612" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="100" cy="638" r="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="118" y="643" font-size="13" fill="#374151">HTTP 請求進入，對應建立一個 Coroutine Scope</text>

  <rect x="93" y="660" width="14" height="14" rx="3" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="118" y="672" font-size="13" fill="#374151">Scope 內同時掛著查詢訂單、確認庫存兩個協程，彼此並行</text>

  <circle cx="580" cy="638" r="7" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="598" y="643" font-size="13" fill="#374151">請求結束，Scope 收合，兩個協程跟著一併結束</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
