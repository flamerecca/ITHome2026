<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">漸進式測試情境：模擬一場促銷活動的流量爬升</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">k6 ramping-vus 分四個階段提升虛擬使用者數量，每階段維持一段時間觀察系統反應</text>
