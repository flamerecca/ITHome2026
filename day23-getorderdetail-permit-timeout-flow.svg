<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <rect x="0" y="0" width="1200" height="710" fill="#ffffff"/>
  <text x="600.0" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">getOrderDetail 裡，只有呼叫下游的那一段被包了兩層</text>
  <text x="600.0" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">withPermit 在外、withTimeout 在內，排隊等候名額的時間不算進逾時倒數</text>
  <rect x="40" y="96" width="1120" height="50" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="70" y="127" text-anchor="start" font-size="13" fill="#1f2937" font-weight="700">請求進入</text>
  <text x="150" y="127" text-anchor="start" font-size="13" fill="#312e81" font-family="Menlo, Consolas, monospace">OrderService.getOrderDetail(orderId)</text>
  <line x1="150" y1="146" x2="150" y2="184" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="40" y="188" width="340" height="120" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="210" y="216" text-anchor="middle" font-size="13.5" fill="#1f2937" font-weight="700">① 查詢訂單</text>
  <text x="210" y="240" text-anchor="middle" font-size="11.5" fill="#334155" font-family="Menlo, Consolas, monospace">orderRepository.findById(orderId)</text>
  <rect x="90" y="254" width="240" height="26" rx="13" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="210" y="272" text-anchor="middle" font-size="12" fill="#4b5563" font-weight="700">不受任何機制保護</text>
  <text x="210" y="298" text-anchor="middle" font-size="11" fill="#6b7280">本地資料庫查詢，風險相對可控</text>
  <line x1="380" y1="248" x2="426" y2="248" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="430" y="170" width="730" height="290" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
  <text x="452" y="196" text-anchor="start" font-size="13" fill="#312e81" font-weight="700">② 外層：stockCheckSemaphore.withPermit { }</text>
  <text x="452" y="216" text-anchor="start" font-size="11.5" fill="#4338ca">Semaphore(permits = 20)，限制同時執行的呼叫數量</text>
  <rect x="452" y="234" width="170" height="96" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.4"/>
  <text x="537" y="262" text-anchor="middle" font-size="12.5" fill="#312e81" font-weight="700">排隊等候名額</text>
  <text x="537" y="284" text-anchor="middle" font-size="11" fill="#4b5563">超過 20 個呼叫時</text>
  <text x="537" y="302" text-anchor="middle" font-size="11" fill="#4b5563">協程暫停排隊</text>
  <line x1="622" y1="282" x2="664" y2="282" stroke="#4338ca" stroke-width="2.2" marker-end="url(#ar-indigo)"/>
  <text x="643" y="270" text-anchor="middle" font-size="10.5" fill="#4338ca">取得名額</text>
  <rect x="668" y="226" width="470" height="116" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <text x="686" y="250" text-anchor="start" font-size="13" fill="#9a3412" font-weight="700">③ 內層：withTimeout(2_000) { }</text>
  <rect x="700" y="264" width="406" height="34" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="903" y="286" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="Menlo, Consolas, monospace">stockClient.checkStock(orderId)</text>
  <text x="686" y="326" text-anchor="start" font-size="11.5" fill="#9a3412">下游服務卡住超過 2 秒 → TimeoutCancellationException</text>
  <text x="452" y="372" text-anchor="start" font-size="11.5" fill="#4b5563" font-weight="700">時間軸</text>
  <rect x="452" y="392" width="212" height="20" rx="4" fill="#e0e7ff"/>
  <text x="558" y="406" text-anchor="middle" font-size="11" fill="#312e81">排隊時間，不計入逾時</text>
  <rect x="668" y="392" width="470" height="20" rx="4" fill="#fed7aa"/>
  <text x="903" y="406" text-anchor="middle" font-size="11" fill="#7c2d12">逾時倒數 2 秒，只算真正執行呼叫的這一段</text>
  <line x1="666" y1="378" x2="666" y2="426" stroke="#dc2626" stroke-width="2.4"/>
  <circle cx="666" cy="378" r="5" fill="#dc2626"/>
  <text x="666" y="442" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">逾時計時起點：取得 Semaphore 名額之後</text>
  <line x1="700" y1="460" x2="640" y2="500" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="890" y1="460" x2="950" y2="500" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <text x="650" y="480" text-anchor="end" font-size="11" fill="#166534">成功</text>
  <text x="940" y="480" text-anchor="start" font-size="11" fill="#b91c1c">逾時</text>
  <rect x="430" y="504" width="350" height="82" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="605" y="530" text-anchor="middle" font-size="13" fill="#14532d" font-weight="700">正常回應</text>
  <text x="605" y="554" text-anchor="middle" font-size="11" fill="#334155" font-family="Menlo, Consolas, monospace">stockAvailable = stockStatus.available</text>
  <rect x="810" y="504" width="350" height="82" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="985" y="530" text-anchor="middle" font-size="13" fill="#7f1d1d" font-weight="700">逾時</text>
  <text x="985" y="554" text-anchor="middle" font-size="11.5" fill="#4b5563">catch 後 stockStatus 落為 null</text>
  <text x="985" y="573" text-anchor="middle" font-size="11.5" fill="#4b5563">stockAvailable = false，查詢不整個失敗</text>
  <line x1="605" y1="586" x2="700" y2="634" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <line x1="985" y1="586" x2="860" y2="634" stroke="#6b7280" stroke-width="2.2" marker-end="url(#ar-gray)"/>
  <rect x="560" y="638" width="440" height="46" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="780" y="666" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="700">組裝 OrderDetailResponse，方法簽章不變</text>
  <text x="210" y="360" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="700">順序反過來，withTimeout 包在外層</text>
  <text x="210" y="380" text-anchor="middle" font-size="11" fill="#4b5563">排隊時間會被算進 2 秒倒數，</text>
  <text x="210" y="398" text-anchor="middle" font-size="11" fill="#4b5563">還沒開始呼叫就可能被判定逾時</text>
  <rect x="60" y="340" width="300" height="72" rx="10" fill="none" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="ar-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/></marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
  </defs>
</svg>
