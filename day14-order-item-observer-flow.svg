<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="634" viewBox="0 0 1180 634" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1180" height="634" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="590" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">訂單明細儲存與刪除，庫存自動異動流程</text>
  <text x="590" y="64" text-anchor="middle" font-size="13.5" fill="#6b7280">Observer 監聽 OrderItem 生命週期事件，saved 與 deleted 分別對應庫存的扣減與還原</text>

  <!-- ================= 情境一：新增明細，saved 事件路徑 ================= -->
  <text x="60" y="98" font-size="14.5" font-weight="700" fill="#1f2937">情境一：新增訂單明細，saved 事件觸發扣減庫存</text>

  <rect x="60" y="110" width="180" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">訂單明細</text>
  <text x="150" y="164" text-anchor="middle" font-size="12" fill="#374151">執行 create 動作</text>

  <rect x="280" y="110" width="200" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="380" y="142" text-anchor="middle" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#1e3a8a">OrderItem::saved</text>
  <text x="380" y="164" text-anchor="middle" font-size="12" fill="#374151">事件自動觸發</text>

  <rect x="510" y="110" width="220" height="84" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="140" text-anchor="middle" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#78350f">wasRecentlyCreated()</text>
  <text x="620" y="162" text-anchor="middle" font-size="12" fill="#92400e">判斷是否為新增明細</text>
  <text x="620" y="181" text-anchor="middle" font-size="10.5" fill="#92400e">而非既有明細的更新</text>

  <rect x="780" y="110" width="220" height="84" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="890" y="136" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">product 關聯</text>
  <rect x="796" y="146" width="188" height="22" rx="11" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="890" y="161" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#166534">decrementStock()</text>
  <text x="890" y="184" text-anchor="middle" font-size="10.5" fill="#374151">扣減對應商品庫存</text>

  <rect x="780" y="280" width="220" height="64" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="890" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">商品庫存扣減完成</text>
  <text x="890" y="326" text-anchor="middle" font-size="11" fill="#166534">即時反映最新可售數量</text>

  <rect x="510" y="280" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="620" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">不異動庫存</text>
  <text x="620" y="326" text-anchor="middle" font-size="11" fill="#6b7280">非新增明細，略過扣減</text>

  <!-- 情境一連線 -->
  <line x1="240" y1="152" x2="280" y2="152" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="152" x2="510" y2="152" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="152" x2="780" y2="152" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="755" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">是</text>
  <line x1="890" y1="194" x2="890" y2="280" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="194" x2="620" y2="280" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="641" y="238" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">否</text>

  <!-- ================= 情境二：刪除明細，deleted 事件路徑 ================= -->
  <text x="60" y="384" font-size="14.5" font-weight="700" fill="#1f2937">情境二：刪除訂單明細，deleted 事件觸發還原庫存</text>

  <rect x="60" y="402" width="180" height="84" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="150" y="434" text-anchor="middle" font-size="13.5" font-weight="700" fill="#831843">訂單明細</text>
  <text x="150" y="456" text-anchor="middle" font-size="12" fill="#374151">執行 delete 動作</text>

  <rect x="280" y="402" width="200" height="84" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="380" y="434" text-anchor="middle" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, monospace" fill="#831843">OrderItem::deleted</text>
  <text x="380" y="456" text-anchor="middle" font-size="12" fill="#374151">事件自動觸發</text>

  <rect x="510" y="402" width="220" height="84" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="620" y="428" text-anchor="middle" font-size="12.5" font-weight="700" fill="#831843">product 關聯</text>
  <rect x="526" y="438" width="188" height="22" rx="11" fill="#ffffff" stroke="#fbcfe8" stroke-width="1.2"/>
  <text x="620" y="453" text-anchor="middle" font-size="11" font-family="Menlo, Consolas, monospace" fill="#831843">incrementStock()</text>
  <text x="620" y="476" text-anchor="middle" font-size="10.5" fill="#374151">還原對應商品庫存</text>

  <rect x="780" y="402" width="220" height="84" rx="10" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
  <text x="890" y="434" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">商品庫存還原完成</text>
  <text x="890" y="456" text-anchor="middle" font-size="11" fill="#374151">即時反映最新可售數量</text>

  <!-- 情境二連線 -->
  <line x1="240" y1="444" x2="280" y2="444" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="444" x2="510" y2="444" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="444" x2="780" y2="444" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 底部：兩者的分歧點 -->
  <rect x="60" y="520" width="940" height="80" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="530" y="546" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">兩者的分歧點</text>
  <text x="530" y="570" text-anchor="middle" font-size="12.5" fill="#374151">saved 事件：需先判斷 wasRecentlyCreated，只有新增明細才扣減庫存</text>
  <text x="530" y="592" text-anchor="middle" font-size="12.5" fill="#374151">deleted 事件：不需要額外判斷，只要明細被刪除就一律還原庫存</text>

  <!-- 底部說明 -->
  <text x="590" y="618" text-anchor="middle" font-size="12" fill="#6b7280">透過 Model Observer 監聽 OrderItem 生命週期事件，庫存異動與訂單明細操作保持同步</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
