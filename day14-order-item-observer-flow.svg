<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="700" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="580" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">OrderItemObserver 兩個生命週期掛載點</text>
  <text x="580" y="64" text-anchor="middle" font-size="13" fill="#6b7280">saved 與 deleted 各自獨立監聽，掛在 Model 本身，跟操作入口脫鉤</text>

  <!-- 案例主軸標註 -->
  <rect x="380" y="82" width="400" height="30" rx="15" fill="#111827"/>
  <text x="580" y="102" text-anchor="middle" font-size="12.5" fill="#ffffff">案例：飼料訂單明細，數量 10</text>

  <!-- 兩個觸發來源，統一寬 420，統一高 64，統一 y 起點 130，中心對齊下方欄位容器中心 320／840 -->
  <rect x="110" y="130" width="420" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">訂單明細　儲存動作</text>
  <text x="320" y="178" text-anchor="middle" font-size="12.5" fill="#1e40af">新增一筆明細並存進資料庫</text>

  <rect x="630" y="130" width="420" height="64" rx="10" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="840" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">訂單明細　刪除動作</text>
  <text x="840" y="178" text-anchor="middle" font-size="12.5" fill="#be185d">這筆明細從資料庫中移除</text>

  <!-- 分岔箭頭，從兩張入口卡片下緣垂直下探到左右欄容器頂端 -->
  <line x1="320" y1="194" x2="320" y2="234" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="840" y1="194" x2="840" y2="234" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- 左欄：saved 事件路徑，寬 500，x 70 到 570，y 234 到 560 -->
  <rect x="70" y="234" width="500" height="326" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="70" y="234" width="500" height="40" rx="12" fill="#16a34a"/>
  <rect x="70" y="254" width="500" height="20" fill="#16a34a"/>
  <text x="320" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">saved 事件觸發</text>

  <text x="90" y="298" font-size="12.5" fill="#14532d">先判斷 wasRecentlyCreated，</text>
  <text x="90" y="316" font-size="12.5" fill="#14532d">確認這筆是不是剛剛才新增</text>

  <rect x="90" y="334" width="220" height="70" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="106" y="355" font-size="12" font-weight="600" fill="#374151">是新增　繼續往下</text>
  <text x="106" y="374" font-size="11.5" fill="#15803d">product 關聯執行</text>
  <text x="106" y="392" font-size="11.5" fill="#15803d">decrement stock</text>

  <rect x="330" y="334" width="220" height="70" rx="8" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="346" y="355" font-size="12" font-weight="600" fill="#374151">是更新　不是新增</text>
  <text x="346" y="374" font-size="11.5" fill="#6b7280">不異動庫存</text>
  <text x="346" y="392" font-size="11.5" fill="#6b7280">直接結束這次監聽</text>

  <rect x="90" y="424" width="460" height="60" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="106" y="446" font-size="12" fill="#14532d">decrement 是資料庫層級的原子操作</text>
  <text x="106" y="464" font-size="12" fill="#14532d">不必先查出商品再存回去，避免併發覆蓋</text>

  <rect x="90" y="504" width="460" height="34" rx="17" fill="#dcfce7"/>
  <text x="320" y="526" text-anchor="middle" font-size="11.5" fill="#14532d">飼料庫存扣減 10，數字對得起來</text>

  <!-- 右欄：deleted 事件路徑，寬 500，x 590 到 1090，對齊左欄同高同寬 -->
  <rect x="590" y="234" width="500" height="326" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="590" y="234" width="500" height="40" rx="12" fill="#d97706"/>
  <rect x="590" y="254" width="500" height="20" fill="#d97706"/>
  <text x="840" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">deleted 事件觸發</text>

  <text x="610" y="298" font-size="12.5" fill="#78350f">明細確定從資料庫消失後，</text>
  <text x="610" y="316" font-size="12.5" fill="#78350f">quantity 欄位值此刻仍讀得到</text>

  <rect x="610" y="334" width="460" height="70" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  <text x="626" y="355" font-size="12" font-weight="600" fill="#374151">product 關聯執行</text>
  <text x="626" y="374" font-size="11.5" fill="#92400e">increment stock</text>
  <text x="626" y="392" font-size="11.5" fill="#92400e">用同一個數字反向還原</text>

  <rect x="610" y="424" width="460" height="60" rx="8" fill="#fde68a" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="626" y="446" font-size="12" fill="#78350f">剛才扣掉多少，這裡就還回多少</text>
  <text x="626" y="464" font-size="12" fill="#78350f">跟 saved 事件各自獨立，沒有互相呼叫</text>

  <rect x="610" y="504" width="460" height="34" rx="17" fill="#fde68a"/>
  <text x="840" y="526" text-anchor="middle" font-size="11.5" fill="#78350f">飼料庫存還原回刪除前的樣子</text>

  <!-- 底部說明 -->
  <text x="580" y="632" text-anchor="middle" font-size="12" fill="#6b7280">兩段邏輯都掛在 OrderItem 這個 Model 本身，透過 AppServiceProvider 註冊 Observer</text>
  <text x="580" y="652" text-anchor="middle" font-size="12" fill="#6b7280">無論從 Filament 表單、命令列或未來的 API 建立與刪除，都會一致觸發，不需要在每個入口各補一次</text>
  <text x="580" y="672" text-anchor="middle" font-size="12" fill="#9ca3af">今天只處理新增與刪除，數量編輯後的重新計算留給讀者依實際需求擴充</text>

  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
