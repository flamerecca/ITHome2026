<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" font-family="'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', -apple-system, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1040" height="480" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="520" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">訂單列表頁客戶欄位改版前後對照</text>

  <!-- 欄標籤 -->
  <text x="255" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">改版前，裸主鍵數字</text>
  <text x="785" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7280">改版後，店名 + 徽章</text>

  <!-- 左側面板 -->
  <rect x="60" y="98" width="390" height="330" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="80" y="126" font-size="13" font-weight="600" fill="#7f1d1d">訂單編號　　客戶欄位</text>

  <line x1="80" y1="140" x2="420" y2="140" stroke="#fca5a5"/>
  <text x="80" y="164" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0012</text>
  <text x="260" y="164" font-size="15" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">7</text>

  <line x1="80" y1="182" x2="420" y2="182" stroke="#fca5a5" stroke-dasharray="2 2"/>
  <text x="80" y="206" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0013</text>
  <text x="260" y="206" font-size="15" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">12</text>

  <line x1="80" y1="224" x2="420" y2="224" stroke="#fca5a5" stroke-dasharray="2 2"/>
  <text x="80" y="248" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0014</text>
  <text x="260" y="248" font-size="15" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">3</text>

  <line x1="80" y1="266" x2="420" y2="266" stroke="#fca5a5" stroke-dasharray="2 2"/>
  <text x="80" y="290" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0015</text>
  <text x="260" y="290" font-size="15" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">7</text>

  <text x="255" y="340" text-anchor="middle" font-size="12.5" fill="#991b1b">只看得到 customer_id 外鍵</text>
  <text x="255" y="358" text-anchor="middle" font-size="12.5" fill="#991b1b">使用者無法判斷是哪家客戶</text>

  <!-- 中央箭頭 -->
  <line x1="450" y1="263" x2="590" y2="263" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 右側面板 -->
  <rect x="590" y="98" width="390" height="330" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="610" y="126" font-size="13" font-weight="600" fill="#14532d">訂單編號　客戶　　　地區　　狀態</text>

  <line x1="610" y1="140" x2="950" y2="140" stroke="#86efac"/>
  <text x="610" y="164" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0012</text>
  <text x="672" y="164" font-size="12" fill="#14532d">旺旺寵物用品行</text>
  <rect x="800" y="152" width="40" height="20" rx="10" fill="#38bdf8"/>
  <text x="820" y="166" text-anchor="middle" font-size="10" fill="#ffffff">北部</text>
  <rect x="846" y="152" width="56" height="20" rx="10" fill="#f59e0b"/>
  <text x="874" y="166" text-anchor="middle" font-size="10" fill="#ffffff">待處理</text>

  <line x1="610" y1="182" x2="950" y2="182" stroke="#86efac" stroke-dasharray="2 2"/>
  <text x="610" y="206" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0013</text>
  <text x="672" y="206" font-size="12" fill="#14532d">台北市寵物協會</text>
  <rect x="800" y="194" width="40" height="20" rx="10" fill="#38bdf8"/>
  <text x="820" y="208" text-anchor="middle" font-size="10" fill="#ffffff">北部</text>
  <rect x="846" y="194" width="56" height="20" rx="10" fill="#22c55e"/>
  <text x="874" y="208" text-anchor="middle" font-size="10" fill="#ffffff">已出貨</text>

  <line x1="610" y1="224" x2="950" y2="224" stroke="#86efac" stroke-dasharray="2 2"/>
  <text x="610" y="248" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0014</text>
  <text x="672" y="248" font-size="12" fill="#14532d">來來寵物美容</text>
  <rect x="800" y="236" width="40" height="20" rx="10" fill="#a78bfa"/>
  <text x="820" y="250" text-anchor="middle" font-size="10" fill="#ffffff">中部</text>
  <rect x="846" y="236" width="56" height="20" rx="10" fill="#f59e0b"/>
  <text x="874" y="250" text-anchor="middle" font-size="10" fill="#ffffff">待處理</text>

  <line x1="610" y1="266" x2="950" y2="266" stroke="#86efac" stroke-dasharray="2 2"/>
  <text x="610" y="290" font-size="13" font-family="Menlo, Consolas, monospace" fill="#374151">A0015</text>
  <text x="672" y="290" font-size="12" fill="#14532d">旺旺寵物用品行</text>
  <rect x="800" y="278" width="40" height="20" rx="10" fill="#38bdf8"/>
  <text x="820" y="292" text-anchor="middle" font-size="10" fill="#ffffff">北部</text>
  <rect x="846" y="278" width="56" height="20" rx="10" fill="#3b82f6"/>
  <text x="874" y="292" text-anchor="middle" font-size="10" fill="#ffffff">已確認</text>

  <text x="785" y="340" text-anchor="middle" font-size="12.5" fill="#166534">店名直接顯示，附帶地區徽章與狀態徽章</text>
  <text x="785" y="358" text-anchor="middle" font-size="12.5" fill="#166534">掃視即可判斷這張訂單屬於哪個客戶</text>

  <!-- 底部說明 -->
  <text x="520" y="452" text-anchor="middle" font-size="13" fill="#6b7280">來源：Day 10 TextColumn::make('customer.name') 與 customer.region 的關聯欄位取值</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
